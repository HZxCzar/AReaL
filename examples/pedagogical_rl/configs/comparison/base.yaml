# Fair-comparison PedagogicalRL arm.
#
# Controlled substitutions shared with our arm:
#   Qwen3-8B rank-16 LoRA teacher, Qwen3-1.7B student, Math Pass@2 data,
#   16 problems x 8 trajectories, 1000 rollout batches, ten teacher turns,
#   and the common reasoning/output/end XML interface.
#
# PedagogicalRL itself remains native: GUIDED/ATTEMPTED assignment, native
# teacher/student prompts, two whole-dialogue hard gates, eight final attempts,
# its four scalar reward slots (format replaces the inactive thinking slot),
# episode-level group normalization, PPO epsilon=.2, beta=.001 forward KL, and
# mu=2 full-batch updates per sampled batch. There is no preference and no
# pre-solve during training.

experiment_name: pedagogical-rl-comparison
trial_name: 0904-pedagogical-rl-qwen3-8b
seed: 42
enable_offload: false
dynamic_bs: false
total_train_epochs: 1000
# Same sampled-data budget as our 0901 arm:
# 1000 x 16 problems x 8 trajectories = 128,000 trajectories.
# PedagogicalRL's native mu=2 is retained, hence 2,000 policy updates.
total_train_steps: 1000
tokenizer_path: ${actor.path}

workflow: examples.pedagogical_rl.workflow.PedagogicalRLWorkflow
eval_workflow: ${workflow}
max_train_examples: -1
max_eval_examples: -1
debug_trace_dir: ${cluster.fileroot}/${experiment_name}/${trial_name}/debug_traces
debug_trace_every_n_rollouts: 10

student_model:
  mode: api
  base_url: ${oc.env:TUTOR_QWEN3_1_7B_BASE_URL}
  model: ${oc.env:PED_STUDENT_API_MODEL,qwen3-1.7b}
  api_key: ${oc.env:INF_API_KEY}
  timeout: 120
  max_retries: 2
  max_concurrent_calls: 32
  seed: 42
  top_k: 50
  min_p: 0.0
  extra_headers: {}
  chat_template_kwargs:
    enable_thinking: false

judge_model:
  # The rollout engine serves the frozen base Qwen3-8B with LoRA disabled.
  # No external judge endpoint is contacted.
  mode: self
  base_url: ""
  model: qwen3-8b
  api_key: ""
  timeout: 120
  max_retries: 2
  max_concurrent_calls: 32
  seed: 42
  top_k: 50
  min_p: 0.0
  extra_headers: {}
  chat_template_kwargs:
    enable_thinking: false

generation:
  # The paper code defaults to 15 combined messages. We use the agreed common
  # budget of ten teacher actions for both arms.
  max_teacher_turns: 10
  max_tokens_in_conversation: 8192
  max_tokens_per_teacher_turn: 2048
  max_tokens_per_student_turn: 1024
  max_tokens_per_student_attempt: 3900
  max_tokens_per_judge_attempt: 2048
  number_student_attempts: 8
  number_judge_attempts: 2
  student_temperature: 0.6
  student_top_p: 1.0
  judge_temperature: 0.6
  judge_top_p: 1.0
  extra_penalty_for_rejected_judges: 1.0
  use_thinking: false
  teacher_output_format: unified_xml
  format_error_penalty: -0.5
  leak_judge_mode: pedagogical_rl

teacher_pre:
  enabled: false
  verify: false
  attempts: 1
  max_tokens: 0

evaluation:
  matrix_enabled: false
  compute_initial_attempts: false
  conversation_types: [GUIDED, ATTEMPTED]
  preference_names: [none]
  preference_prompts_path: ""
  preference_complaints_path: ""
  preference_gate_retries: 3
  preference_explain_ratio: 1.0
  preference_gate_temperature: 0.0
  preference_gate_top_p: 1.0
  preference_gate_top_k: 20
  preference_gate_min_p: 0.0
  preference_gate_max_tokens: 1024
  record_turn_leak_diagnostic: false

cross_eval:
  enabled: false

cluster:
  n_nodes: 1
  n_gpus_per_node: 2
  fileroot: /inspire/hdd/project/qproject-fundationmodel/public/wxxu/TAgent/output_hdd/pedagogical_rl
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name_resolve

scheduler:
  type: local

rollout:
  backend: sglang:d1p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 16
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  pause_grace_period: 10
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  use_lora: true
  dump_to_file: true
  openai:
    mode: inline
    tool_call_parser: qwen25
    reasoning_parser: qwen3
    chat_template_type: concat
    export_style: concat
    turn_discount: 1.0

gconfig:
  n_samples: 8
  min_new_tokens: 0
  max_new_tokens: 2048
  max_tokens: 12000
  greedy: false
  temperature: 1.0
  top_p: 1.0
  top_k: 50
  lora_name: default_lora

eval_gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 2048
  max_tokens: 12000
  greedy: false
  temperature: 0.6
  top_p: 1.0
  top_k: 50
  lora_name: default_lora

actor:
  backend: fsdp:d1p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /inspire/hdd/project/qproject-fundationmodel/public/wxxu/.cache/huggingface/hub/models--Qwen--Qwen3-8B/snapshots/b968826d9c46dd6066d109eabc6255188de91218
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 40960
  optimizer:
    # Upstream uses 5e-7 for full-parameter 7B training. This controlled
    # comparison uses rank-16 LoRA, so match the Tutor arm's LoRA LR.
    type: adam
    lr: 5.0e-5
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  eps_clip: 0.2
  c_clip: null
  use_ppo_clip: true
  advantage_estimator: gae
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  reward_clip: 20.0
  # In this example adapter kl_ctl is PedagogicalRL's beta. It is applied as
  # the native forward-KL term in the token loss, never as reward shaping.
  kl_ctl: 0.001
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: false
  behave_imp_weight_cap: null
  behave_imp_weight_mode: disabled
  reward_norm:
    mean_level: group
    std_level: group
    std_unbiased: true
    eps: 1.0e-4
    group_size: ${gconfig.n_samples}
  adv_norm: null
  num_iterations: 2
  weight_update_mode: disk
  use_lora: ${rollout.use_lora}
  peft_type: lora
  lora_rank: 16
  lora_alpha: 16
  target_modules: [all-linear]
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

# With FSDP LoRA v1, AReaL computes this reference pass by temporarily
# disabling the adapter on the actor; no second model is allocated.
ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 40960
  optimizer: null
  use_lora: false
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

critic: null

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: 64
  disable_radix_cache: false
  context_length: 12000
  mem_fraction_static: 0.75
  enable_lora: ${actor.use_lora}
  max_lora_rank: ${actor.lora_rank}
  max_loaded_loras: 16

train_dataset:
  batch_size: 16
  shuffle: true
  drop_last: true
  pin_memory: false
  num_workers: 0
  path: examples/pedagogical_rl/data/math_1.7b_8b/math_pass@2
  type: rl
  max_length: 12000
  scheduling_spec: null

# Final comparison evaluation is run separately over the complete matrix.
valid_dataset: null

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 25
  freq_secs: null

recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 25
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  eval_before_train: false
  freq_epochs: null
  freq_steps: null
  freq_secs: null
  average_rollouts: 1

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: offline
    entity: hz-czar-stanford
    project: TAgent
    name: ${trial_name}
    group: 0904-pedagogical-rl-comparison
    tags: [qwen3-8b, qwen3-1.7b, math-pass2, pedagogical-rl, comparison]
