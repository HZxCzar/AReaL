experiment_name: tutor-grpo
trial_name: werewolf-qwen3_5-2b-teacher-qwen3-0_6b-student

seed: 1
enable_offload: false
total_train_epochs: 1
tokenizer_path: ${actor.path}

game: werewolf
student_base_url: http://127.0.0.1:30001/v1
student_api_key: EMPTY
student_api_model: Qwen/Qwen3-0.6B
student_temperature: 0.2
student_top_p: 1.0
student_max_tokens: 1024
max_episode_turns: 30
turn_discount: 0.98
use_privileged_teacher_observation: false
consistency_coef: 0.15
reasoning_coef: 0.20
tutor_quality_coef: 0.60
action_quality_coef: 0.80
leakage_coef: 1.2
direct_action_penalty: 0.7
task_reward_coef: 2.0
invalid_action_penalty: 0.3
teacher_policy: >
  Tutor with public-facing reasoning only. Emphasize public discussion,
  consistency, voting pressure, claim credibility, uncertainty, and one decision
  criterion. Never state hidden roles, private night facts, exact targets, or the
  exact final action for the student.
env_kwargs:
  num_villagers: 3
  num_werewolves: 1
  num_witches: 0
  num_foreseers: 0
  num_hunters: 0

cluster:
  n_nodes: 1
  n_gpus_per_node: 4
  fileroot: /home/xmy/AReaL/results/teacher-grpo-runs
  name_resolve:
    type: nfs
    nfs_record_root: /home/xmy/AReaL/results/teacher-grpo-runs
scheduler:
  type: null

rollout:
  backend: sglang:d4p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 16
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 4
  enable_rollout_tracing: true
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true

gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 1024
  greedy: false
  temperature: 1.0

actor:
  backend: fsdp:d4p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /data/xmy/models/Qwen3.5-2B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 16384
  optimizer:
    type: adam
    lr: 3e-6
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.3
  temperature: ${gconfig.temperature}
  reward_scaling: 2.0
  weight_update_mode: xccl
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 4
      mem: 32
      image: ""
      mount: ""
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 16384
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  context_length: 16384
  mem_fraction_static: 0.72

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 16384
  gpu_memory_utilization: 0.72

train_dataset:
  batch_size: 8
  pin_memory: true
  num_workers: 1
  path: /home/xmy/AReaL/examples/tutor_teacher_train_seeds.jsonl
  type: rl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 25
  freq_secs: 1800
recover:
  mode: auto
  retries: 3
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 10
  freq_secs: 1800
evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null
stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: online
perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
