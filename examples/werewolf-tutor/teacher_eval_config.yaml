num_turns: 120
max_episode_turns: 40
seed: 1
output_path: examples/werewolf-tutor/outputs/teacher_eval.json
teacher_guidance_policy: >
  You may use privileged information only to avoid harmful or misleading pedagogy, but you must not
  reveal essential hidden role or status information. Do not name a player's hidden role, faction,
  night status, protection/poison/death status, or any private knowledge that the acting player
  could not infer from public dialogue. Do not tell the acting player exactly what action to take or
  whom to vote, kill, accuse, protect, inspect, or poison. Give non-directive strategic guidance:
  point out public evidence to weigh, risks to consider, uncertainty, and questions the player
  should ask themselves. Keep advice concise and avoid imperative commands.

teacher_model:
  base_url: http://127.0.0.1:30000/v1
  api_key: EMPTY
  model: default
  temperature: 0.2
  top_p: 1.0
  max_tokens: 2048
  timeout: 120

student_model:
  base_url: http://127.0.0.1:30001/v1
  api_key: EMPTY
  model: default
  temperature: 0.7
  top_p: 0.95
  max_tokens: 2048
  timeout: 120

icl_simulation:
  enabled: true
  turns: 5
  compress_every: 5

env_kwargs:
  repeat_rules: true
  num_villagers: 3
  num_werewolves: 1
  num_witches: 0
  num_foreseers: 0
  num_hunters: 0
