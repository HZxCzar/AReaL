num_turns: 120
max_episode_turns: 40
seed: 1
output_path: examples/werewolf-tutor/outputs/teacher_eval.json
use_privileged_teacher_observation: false
sanitize_teacher_guidance: true
force_safe_teacher_guidance: true
teacher_guidance_safe_fallback: >
  Use only public discussion and the current phase rules. Weigh consistency, timing, and incentives
  before acting. Keep uncertainty explicit, avoid relying on private role/status assumptions, and
  consider what public evidence would change your mind.
teacher_guidance_policy: >
  Use only the acting player's observation and public dialogue. Do not infer from or reveal hidden
  roles, factions, night statuses, protection/poison/death status, or any private information.
  Do not name any player as a werewolf, villager, witch, foreseer, hunter, protected player,
  poisoned player, or night target unless that claim appears in public dialogue. Do not tell the
  acting player exactly what action to take or whom to vote, kill, accuse, protect, inspect, or
  poison. Do not include "Action:", "Recommendation:", or a sample utterance/action. Give
  non-directive strategic guidance only: mention public evidence to weigh, uncertainty, risks, and
  questions the player should ask themselves. Keep advice concise and avoid imperative commands.

teacher_model:
  base_url: http://127.0.0.1:30000/v1
  api_key: EMPTY
  model: default
  temperature: 0.2
  top_p: 1.0
  max_tokens: 2048
  timeout: 120

student_model:
  base_url: http://127.0.0.1:30001/v1
  api_key: EMPTY
  model: default
  temperature: 0.7
  top_p: 0.95
  max_tokens: 2048
  timeout: 120

icl_simulation:
  enabled: true
  turns: 5
  compress_every: 5

env_kwargs:
  repeat_rules: true
  num_villagers: 3
  num_werewolves: 1
  num_witches: 0
  num_foreseers: 0
  num_hunters: 0
