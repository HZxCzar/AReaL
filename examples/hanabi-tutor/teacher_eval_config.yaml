num_turns: 300
max_episode_turns: 150
seed: 1
output_path: examples/hanabi-tutor/outputs/teacher_eval.json

teacher_model:
  base_url: http://127.0.0.1:30000/v1
  api_key: EMPTY
  model: default
  temperature: 0.2
  top_p: 1.0
  max_tokens: 2048
  timeout: 120

student_model:
  base_url: http://127.0.0.1:30001/v1
  api_key: EMPTY
  model: default
  temperature: 0.7
  top_p: 0.95
  max_tokens: 2048
  timeout: 120

icl_simulation:
  enabled: true
  turns: 5
  compress_every: 5

env_kwargs:
  num_players: 2
  scenario: simple
  repeat_rules: true
