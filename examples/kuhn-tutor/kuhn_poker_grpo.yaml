experiment_name: kuhn-poker-grpo
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 5
tokenizer_path: ${actor.path}

# Kuhn Poker-specific options
player_id: 0
use_mixed_player: true
opp_server_addrs: "33.180.173.17:27134, 33.180.173.17:20522, 33.180.173.17:30677, 33.180.173.17:17860, 33.180.173.17:35543, 33.180.173.17:46366, 33.180.173.17:10418, 33.180.173.17:43106"
opp_tokenizer_path: "/storage/openpsi/models/Qwen__Qwen3-4B"
opp_api_key: ""
opp_api_model: ""
teacher_server_addrs: ""
teacher_tokenizer_path: ""
teacher_api_key: ""
teacher_api_model: ""
teacher_process_reward: false
process_reward_coef: 0.2
env_kwargs:
  built_in_opponent: none # none: self-play; cfr; mcts
  opponent_player: 1
  include_opponent_turn: action
  uct_c: 2.0
  max_simulations: 100
  rollout_count: 10
  cfr_iterations: 1000
max_turns: 6
turn_discount: 1.0

cluster:
  n_nodes: 2
  n_gpus_per_node: 4
  fileroot: /storage/openpsi/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /storage/openpsi/experiments
scheduler:
  type: null

rollout:
  backend: "sglang:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 64
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 4
  enable_rollout_tracing: true
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true

# Generation hyperparameters
gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 4096
  greedy: false
  temperature: 1.0

actor:
  backend: "fsdp:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /storage/openpsi/models/Qwen__Qwen3-4B
  # path: /storage/openpsi/experiments/checkpoints/admin/xmy-kuhn/trial-qwen3-4b-cfr-0-bs128-131k/default/epoch0epochstep549globalstep549
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 32768
  optimizer:
    type: adam
    lr: 1e-6
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  behave_imp_weight_cap: 5.0
  adv_norm:
    mean_level: batch
    std_level: batch
  sft_reg: 1.0
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 4
      mem: 32
      image: /storage/openpsi/images/areal-latest.sif
      mount: /storage:/storage
      cmd: python3 -m areal.infra.rpc.rpc_server
      additional_bash_cmds:
        - "pip install open_spiel"
      env_vars: {}

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 32768
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

# SGLang
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.8

# datasets
train_dataset:
  batch_size: 512
  pin_memory: true
  num_workers: 4
  path: /storage/openpsi/users/xmy/inclusionAI/AReaL-New/data/Werewolf_placeholder_131k.jsonl
  type: rl

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 50
  freq_secs: 3600

recover:
  mode: auto
  retries: 5
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 10
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: online

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
