rounds: 2
num_turns: 16
seed: 7
examples_per_episode: 128
success_threshold: 0.95
output_path: examples/hidden-rule-tutor/outputs/teacher_eval.json
tutor_knows_rule: false

teacher_model:
  base_url: http://127.0.0.1:30000/v1
  api_key: EMPTY
  model: default
  temperature: 0.2
  top_p: 1.0
  max_tokens: 2048
  timeout: 120

student_model:
  base_url: http://127.0.0.1:30001/v1
  api_key: EMPTY
  model: default
  temperature: 0.4
  top_p: 0.95
  max_tokens: 2048
  timeout: 120

icl_simulation:
  enabled: true
  turns: 5
  compress_every: 5
