experiment_name: codecoach-grpo
trial_name: tutorinf-style-pairwise

seed: 1
enable_offload: false
total_train_epochs: 200
tokenizer_path: ${actor.path}

workflow: examples.codecoach.workflow.CodeCoachAgentWorkflow
eval_workflow: ${workflow}
max_turns: 5
enable_thinking: true

auxiliary_model:
  mode: api
  enable_thinking: false
  base_url: http://127.0.0.1:30001/v1
  model: default
  api_key: EMPTY
  timeout: 120
  max_tokens: 4096
  temperature: 0.7
  top_p: 0.8
  max_concurrent_calls: 4
  request_params:
    seed: 42

reward:
  token_budget_penalty: -0.2
  pairwise:
    enabled: true
    reference_lag_steps: 5
    scale: 0.05
    compare_all_turns: true

work_dir_root: /inspire/hdd/project/qproject-fundationmodel/public/wxxu/TAgent/outputs/codecoach/artifacts
debug_trace_dir: /inspire/hdd/project/qproject-fundationmodel/public/wxxu/TAgent/outputs/codecoach/debug_traces/${experiment_name}/${trial_name}
debug_trace_every_n_rollouts: 10

cluster:
  n_nodes: 1
  n_gpus_per_node: 4
  fileroot: /inspire/hdd/project/qproject-fundationmodel/public/wxxu/TAgent/outputs/codecoach
  name_resolve:
    type: nfs
    nfs_record_root: /inspire/hdd/project/qproject-fundationmodel/public/wxxu/TAgent/outputs/codecoach/name_resolve

scheduler:
  type: local

rollout:
  backend: "sglang:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 8
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  pause_grace_period: 10
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  use_lora: true
  dump_to_file: true
  openai:
    mode: inline
    tool_call_parser: qwen25
    reasoning_parser: qwen3
    chat_template_type: concat
    export_style: concat
    turn_discount: 1.0

gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 16384
  max_tokens: 18432
  greedy: false
  temperature: 1.0
  top_p: 1.0
  lora_name: default_lora

eval_gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 16384
  max_tokens: 18432
  greedy: false
  temperature: 0.6
  top_p: 1.0
  lora_name: default_lora

actor:
  backend: "fsdp:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /inspire/hdd/project/qproject-fundationmodel/public/wxxu/.cache/huggingface/hub/models--Qwen--Qwen3-8B/snapshots/b968826d9c46dd6066d109eabc6255188de91218
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 24576
  optimizer:
    type: adam
    lr: 1.70e-5
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 8
  recompute_logprob: true
  use_decoupled_loss: true
  behave_imp_weight_cap: 5.0
  reward_norm: null
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: disk
  use_lora: ${rollout.use_lora}
  peft_type: lora
  lora_rank: 16
  lora_alpha: 16
  target_modules: [all-linear]
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 24576
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 40960
  mem_fraction_static: 0.6
  enable_lora: ${actor.use_lora}
  max_lora_rank: ${actor.lora_rank}
  max_loaded_loras: 16

train_dataset:
  batch_size: 4
  shuffle: true
  pin_memory: false
  num_workers: 0
  path: /inspire/hdd/project/qproject-fundationmodel/public/wxxu/TAgent/AReaL/examples/codecoach/circle_packing_dataset
  type: rl
  max_length: 16384

valid_dataset:
  batch_size: 4
  pin_memory: false
  num_workers: 0
  path: /inspire/hdd/project/qproject-fundationmodel/public/wxxu/TAgent/AReaL/examples/codecoach/circle_packing_dataset
  type: rl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: offline
    entity: hz-czar-stanford
    project: TAgent
    name: ${trial_name}
