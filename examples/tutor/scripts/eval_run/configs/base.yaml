version: 1
protocol: ../protocol.yaml
teacher:
  model: qwen3-8b
  endpoint_env: TEACHER_BASE_URL
  key_env: TEACHER_API_KEY
  format: non_thinking
  enable_thinking: false
  checkpoint: null
  adapter_env: null
  request_params:
    seed: 42
roles:
  student:
    model: qwen3-1.7b
    endpoint_env: STUDENT_BASE_URL
    key_env: STUDENT_API_KEY
  auxiliary:
    model: qwen3.8-27b-fp8
    endpoint_env: AUX_BASE_URL
    key_env: AUX_API_KEY
evaluation:
  preferences:
    - none
    - attempt-diagnosis
    - subgoal-decomposition
    - contrastive-comparison
    - causal-justification
    - step-demonstration
    - independent-verification
  # Comparison grouping, not a claim about every teacher's training membership.
  id_preferences: [none, attempt-diagnosis, subgoal-decomposition, contrastive-comparison]
  attempts: 1
  expected_questions: 528
execution:
  concurrency: 8
  student_concurrency: 16
  auxiliary_concurrency: 16
  episode_timeout_seconds: 600
  episode_error_retries: 3
  proxy: environment
