  - _self_

trial_name: qwen8b-train-qwen1.7b-eval3-math-pass@2-pre-aleak-question

prompt_pool:
  student_turn_behavior:
    enabled: true
    path: examples/tutor/prompt_pools/student_request_behaviors_v1.json
