actor:
  # Only difference from -g8k4. The PPO loss is a token-level mean, so an
  # episode's gradient weight is proportional to its trainable tokens; max_turns
  # episodes are 8.1% of episodes but 36.5% of turn rows. This scales each turn's
  # advantage by (mean episode tokens / this episode's tokens) so every episode
  # contributes equal gradient mass.
  episode_loss_weighting: true
