experiment_name: tutor-math-baseline
trial_name: qwen8b-qwen1.7b-math-pass@2-pre-aleak-paw-cmae-wmrl050

seed: 42
enable_offload: false
total_train_epochs: 150
tokenizer_path: ${actor.path}

workflow: examples.tutor.workflow.TutorAgentWorkflow
eval_workflow: ${workflow}
dataset_type: math
answer_scorer: math
max_turns: 10
enable_thinking: false
leak_handling_mode: terminate
teacher_show_ground_truth: false
teacher_anti_leak_instruction_enabled: true

world_model:
  enabled: true
  loss_weight: 1.0
  log_per_turn_nll: true
  per_turn_nll_log_every_n_steps: 1
  system_prompt: >-
    You are a student response predictor. Given the context available to the
    teacher and the teacher's latest visible reply, predict the same student's
    next visible reply. Output only the predicted student reply.
  paw:
    enabled: true
    entropy_filter_enabled: true
    entropy_keep_ratio: 0.75
    cmae_enabled: true
    confidence_threshold: 0.2
    reward_adaptive_enabled: false
    max_episode_return: 1.0
  rl_reweight:
    enabled: true
    mode: continuous
    positive_strength: 0.5
    negative_strength: 0.5
    min_weight: 0.5
    max_weight: 1.5
    continuous_temperature: 1.0
    low_threshold: -0.5
    high_threshold: 0.5
    min_turn_std: 1.0e-6

student_generalize:
  enabled: true
  source: train
  level1_reward: 0.0
  level2_reward: 0.0

teacher_pre:
  enabled: true
  mode: filter_solver
  attempts: 3
  max_tokens: 0

auxiliary_model:
  mode: api
  enable_thinking: false
  base_url: ${oc.env:TUTOR_QWEN3_8B_BASE_URL}
  model: qwen3-8b
  api_key: ${oc.env:INF_API_KEY}
  timeout: 120
  max_tokens: 1024
  temperature: 0.0
  top_p: 1.0
  max_concurrent_calls: 4
  request_params:
    seed: 42
    extra_headers:
      x-inspire-inference-key: tutor-train-qwen8b-auxiliary
    extra_body:
      top_k: 20
      min_p: 0
      chat_template_kwargs:
        enable_thinking: false
  answer_judge_enabled: true
  answer_judge_max_tokens: 256

student_models:
  - name: qwen3-1.7b
    weight: 1.0
    base_url: ${auxiliary_model.base_url}
    model: qwen3-1.7b
    api_key: ${auxiliary_model.api_key}
    timeout: 120
    max_tokens: 2048
    temperature: 0.7
    top_p: 0.8
    max_concurrent_calls: 4
    request_params:
      seed: 42
      extra_headers:
        x-inspire-inference-key: tutor-train-qwen17b-student
      extra_body:
        top_k: 20
        min_p: 0
        chat_template_kwargs:
          enable_thinking: false

reward:
  format_error_penalty: -0.5
  success: 1.0
  leak_penalty_mode: rawbase
  assign_success_reward: false
  leak_penalty: -1.0
  leak_penalty_aggregation: episode
  outcome_prior_turn_weight: 0.5
  outcome_credit_gamma: 0.9
  early_success_bonus: 0.0
  max_turn_penalty: -1.0
  enable_turn_penalty: false
  turn_penalty: -0.01
  length_penalty_threshold_chars: 0
  length_penalty_per_100_chars: 0.0
  length_penalty_min: 0.0

debug_trace_dir: /inspire/qb-ilm/project/qproject-fundationmodel/public/wxxu/TAgent/output/tutor/debug_traces/${experiment_name}/${trial_name}
debug_trace_every_n_rollouts: 10

cluster:
  n_nodes: 1
  n_gpus_per_node: 2
  fileroot: /inspire/qb-ilm/project/qproject-fundationmodel/public/wxxu/TAgent/output/tutor
  name_resolve:
    type: nfs
    nfs_record_root: /inspire/qb-ilm/project/qproject-fundationmodel/public/wxxu/TAgent/output/tutor/name_resolve

scheduler:
  type: local

rollout:
  backend: "sglang:d1p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 128
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  pause_grace_period: 10
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  use_lora: true
  dump_to_file: true
  openai:
    mode: inline
    tool_call_parser: qwen25
    reasoning_parser: qwen3
    chat_template_type: concat
    export_style: concat
    turn_discount: 1.0

gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 4096
  max_tokens: 24576
  greedy: false
  temperature: 0.7
  top_p: 1.0
  lora_name: default_lora

eval_gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 4096
  max_tokens: 24576
  greedy: false
  temperature: 0.7
  top_p: 1.0
  lora_name: default_lora

actor:
  backend: "fsdp:d1p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /inspire/hdd/project/qproject-fundationmodel/public/wxxu/.cache/huggingface/hub/models--Qwen--Qwen3-8B/snapshots/b968826d9c46dd6066d109eabc6255188de91218
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 40960
  optimizer:
    type: adam
    lr: 5.0e-5
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  use_ppo_clip: true
  advantage_estimator: rebn
  turn_discount: 1.0
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 4
  recompute_logprob: true
  use_decoupled_loss: true
  behave_imp_weight_cap: 5.0
  reward_norm: null
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: disk
  use_lora: ${rollout.use_lora}
  peft_type: lora
  lora_rank: 16
  lora_alpha: 16
  target_modules: [all-linear]
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 40960
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: 32
  context_length: 40960
  mem_fraction_static: 0.75
  enable_lora: ${actor.use_lora}
  max_lora_rank: ${actor.lora_rank}
  max_loaded_loras: 16

train_dataset:
  batch_size: 128
  shuffle: false
  pin_memory: false
  num_workers: 0
  path: examples/tutor/data/math_1.7b_8b/math_pass@2
  type: rl
  max_length: 16384

valid_dataset:
  batch_size: ${train_dataset.batch_size}
  pin_memory: false
  num_workers: 0
  path: examples/tutor/data/math_1.7b_8b/math_pass@2
  type: rl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 10
  freq_steps: null
  freq_secs: null

recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 10
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 10
  freq_secs: null
  max_samples: null
  average_rollouts: 3

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: offline
    entity: hz-czar-stanford
    project: TAgent
    name: ${trial_name}
    group: 8&17-leakt
