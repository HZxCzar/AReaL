# Same masked-continue and gate-pass-only credit assignment as reward-v3, with
# small fixed turn-local penalties for both closed visibility gates. Leak and
# personality-gate failures receive no improvement credit and each additionally
# receives a -0.1 post-std penalty on the failed teacher turn.
leak_handling_mode: masked_continue

personality:
  explain_ratio: 1.0

student_generalize:
  gate_pass_credit_only: true

actor:
  group_baseline: turn
  group_baseline_leave1out: true
  group_baseline_local_reward_mode: exclude
  adv_norm:
    mean_level: null
    std_level: batch

reward:
  leak_penalty: -0.1
  personality_gate_fail_penalty: -0.1
  # Lists replace on merge: retain the default format/repeat components while
  # adding the reward-v4-only personality-gate failure component.
  turn_local_components:
    ["leak", "format_error", "teacher_exact_repeat", "personality_gate_fail"]
  turn_local_component_placements:
    leak: post_std
    personality_gate_fail: post_std
