# Gate-pass-only improvement credit, matching reward-v1, but a leak is treated
# like a closed student-visibility gate: do not call the real student, inject the
# fixed anti-leak user reply into teacher-only history, hide both messages from
# later real-student calls and the re-test, and continue to the ten-turn budget.
# The leaked turn receives neither explicit leak penalty nor improvement credit.
leak_handling_mode: masked_continue

student_generalize:
  gate_pass_credit_only: true

actor:
  group_baseline: turn
  group_baseline_leave1out: true
  group_baseline_local_reward_mode: exclude
  adv_norm:
    mean_level: null
    std_level: batch

reward:
  leak_penalty: 0.0
  personality_gate_fail_penalty: 0.0
