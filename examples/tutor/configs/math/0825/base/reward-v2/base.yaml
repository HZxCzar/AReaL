# Reward-only fragment matching the 0818 gate-credit + failure-penalty semantics.
# It is copied here so 0825 remains usable if the 0818 configs are removed.
student_generalize:
  gate_pass_credit_only: true

actor:
  group_baseline: turn
  group_baseline_leave1out: true
  group_baseline_local_reward_mode: exclude
  adv_norm:
    mean_level: null
    std_level: batch

reward:
  personality_gate_fail_penalty: -0.5
  # Lists replace on merge: preserve the default local penalties and add the
  # reward-v2-only gate-failure component here, beside its coefficient.
  turn_local_components: ["leak", "format_error", "personality_gate_fail"]
  turn_local_component_placements:
    personality_gate_fail: post_std
