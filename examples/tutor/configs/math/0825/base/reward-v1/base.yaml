# Gate-pass-only improvement credit, matching the 0818
# base/personality-gate-credit semantics. A gate-failed turn receives zero
# improvement return before the same-turn group baseline; unlike reward-v2, it
# receives no direct personality-gate failure penalty. The default leak, format,
# and exact-repeat local penalties remain unchanged.
student_generalize:
  gate_pass_credit_only: true

actor:
  group_baseline: turn
  group_baseline_leave1out: true
  group_baseline_local_reward_mode: exclude
  adv_norm:
    mean_level: null
    std_level: batch

reward:
  personality_gate_fail_penalty: 0.0
