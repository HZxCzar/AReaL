# Small deployment-style evaluation for the six 0825 teaching preferences.
# Every cell sees the same stratified MATH rows. The launcher selects one student
# at a time so that a cell has one unambiguous gate and one results.jsonl stream.
defaults:
  - ../base/default@_global_
  - _self_

trial_name: 0825-preference-full-student-eval

personality:
  gate_decision_mode: classification
  prompts_path: examples/tutor/prompt_pools/personality_prompts_classification_v2.json

student_models: []
student_axes:
- behaviors: [text]
  informations:
    original:
      mode: full
  personalities:
  - none
  - feedback
  - hinting
  - instructing
  - explaining
  - modeling
  - questioning
  template:
    name: qwen3-1.7b
    weight: 1.0
    base_url: ${oc.env:TUTOR_QWEN3_1_7B_BASE_URL}
    model: qwen3-1.7b
    api_key: ${auxiliary_model.api_key}
    timeout: 120
    max_tokens: 2048
    temperature: 0.7
    top_p: 0.8
    # One evaluator process runs per server pair. With 16 concurrent episodes and
    # eight replays, 192 leaves headroom for the burst of student re-test calls.
    max_concurrent_calls: 192
    request_params:
      seed: 42
      extra_headers:
        x-inspire-inference-key: tutor-eval-qwen17b-student-v2
      extra_body:
        top_k: 20
        min_p: 0
        chat_template_kwargs:
          enable_thinking: false

student_generalize:
  replays: 8

student_type_probe:
  enabled: false

# Match the regular deployment evaluation path: keep leak/format diagnostics but
# do not let either one truncate the dialogue. Teacher pre-solve remains enabled,
# while verification is disabled exactly as in the existing personality evaluator.
evaluator:
  teacher_pre_enabled: true
  teacher_pre_verify: false
  leak_terminate: false
  format_terminate: false
  average_rollouts: 1
