# Fair text+code evaluation shared by the text-only transfer checkpoint and the
# jointly trained text+code checkpoint. Both adapters see the same rows, prompts,
# endpoints, decoding settings, and scoring code.
defaults:
  - two-student-local-format-terminate@_global_
  - _self_

trial_name: fair-transfer-step150-vs-joint-step300-text-code-eval

# Keep exactly the two students under comparison. evaluate_api_teacher snapshots
# this list before applying CLI overrides, so the zero-weight llama/gemma entries
# from the training arm must not be present here.
student_models:
- name: qwen3-1.7b
  mode: text
  weight: 0.5
  base_url: ${oc.env:TUTOR_QWEN3_1_7B_BASE_URL}
  model: qwen3-1.7b
  api_key: ${auxiliary_model.api_key}
  timeout: 120
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.8
  max_concurrent_calls: 32
  request_params:
    seed: 42
    extra_headers:
      x-inspire-inference-key: tutor-train-qwen17b-student
    extra_body:
      top_k: 20
      min_p: 0
      chat_template_kwargs:
        enable_thinking: false
- name: qwen3-1.7b-code
  mode: code
  weight: 0.5
  base_url: ${oc.env:TUTOR_QWEN3_1_7B_BASE_URL}
  model: qwen3-1.7b
  api_key: ${auxiliary_model.api_key}
  timeout: 120
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.8
  max_concurrent_calls: 32
  request_params:
    seed: 42
    extra_headers:
      x-inspire-inference-key: tutor-train-qwen17b-student
    extra_body:
      top_k: 20
      min_p: 0
      chat_template_kwargs:
        enable_thinking: false

evaluator:
  student_model_names:
  - qwen3-1.7b
  - qwen3-1.7b-code

