# 0810fc-presolve-opd -- 4 GPUs. -- distil the with-draft teacher into the
# no-draft teacher, on the leak-local stable settings.
#
# INHERITED from leak-local-stable, not restated below: leak_handling_mode
# terminate, free_chat.no_teaching_baseline, reward.turn_local_components
# ["leak"], format_handling_mode terminate, gconfig.max_new_tokens 1024,
# actor.episode_loss_weighting. This file adds the pre-solve distillation and
# nothing else, so it is a single-factor delta against that arm.
#
# WHAT IT CHANGES. `teacher_pre.enabled` has always been one flag over two
# mechanisms: the private solution draft sits in the teacher's context for every
# turn it then generates, and a rejected draft drops the whole rollout. The
# `-nopre` arms turn both off. This arm keeps the draft but moves it out of the
# prompt and into the loss: the conversation is generated by the NO-DRAFT
# teacher, and the same weights are then run teacher-forced over that
# conversation's own tokens with the draft inserted, with a per-token reverse KL
# pulling the policy toward the with-draft distribution.
#
# The point is that the draft stops being something the deployed model needs. In
# leak-local-stable the model only teaches well while holding a solution it was
# handed; here the draft is supervision at training time and the rollout ships.
#
# HOW. Two keys, and neither does anything without the other -- configs.py
# refuses a config that sets one alone:
#
#     teacher_pre.visibility: opd_only    draft OUT of the rollout prompt
#     opd.context: presolve               draft INTO the OPD teacher prompt
#
# The rollout prompt is then byte-identical to a no-pre-solve arm's. The OPD
# teacher prompt differs from it by exactly two messages, inserted between the
# system turn and the turn that opens the conversation:
#
#     user       FREE_CHAT_TEACHER_SOLVE_PROMPT   ("let us solve it ourselves
#                first ... put your final answer in \boxed{}")
#     assistant  the accepted draft
#
# i.e. exactly the two messages the pre-solve already generates in the with-draft
# arm. Nothing is re-worded for this arm, and nothing is sampled from the
# privileged teacher: it scores the policy's own tokens, so no prompt mismatch
# enters the policy gradient and there is no importance weight to correct.
#
# WHICH CONTROL. Two different questions, and only the first has an arm today:
#
#   vs leak-local-stable            does distillation match holding the draft?
#   vs leak-local-nopre + stable    does the supervision add anything at all?
#
# The second is the single-factor one -- same rollout, no supervision -- and there
# is no `-nopre-stable` file yet. Read this against leak-local-stable knowing that
# comparison moves two things at once.
#
# WHY on_reject: continue. `verify: true` keeps the filter's three attempts and
# its quality bar on the draft, but 'skip' would also drop ~5% of rollouts, and
# then this arm would differ from a no-draft control by the filter as well as by
# the distillation. 'continue' keeps the episode with the draft simply absent;
# those turns are skipped for supervision and counted in opd/skipped_no_presolve.
#
# WHY share_per_group. The draft rides in the teacher's prompt, so one draft per
# rollout gives a group 8 DIFFERENT prompts and the leave-one-out baseline ends up
# averaging partly over which draft was drawn rather than over how well the
# teacher taught. One draft per problem per weight version fixes that, costs one
# generation instead of 8, and lets the group share a prompt prefix. The cache
# never survives a weight update -- the teacher is the model being trained.
#
# WHY min_prior_failed_turns: 0. The default 2 exists for the repair instruction,
# which asserts the teacher's previous message did not get through. A solution
# draft makes no claim about the history, so it is valid from turn 1 -- and turn 1
# is where the draft matters most: measured on 20260811_092902 and
# 20260811_092825, the opening shares 0.527 of its content words with the draft
# against 0.214 with the task.
#
# LOSS WEIGHT -- READ BEFORE RAISING IT. The KL is added to the advantage after
# the group baseline AND after adv_norm, and is not itself normalized, so it
# competes with a task advantage that arrives at unit std. The instruction arms
# ran opd_reverse_kl/avg at 0.016-0.021 nats/token, i.e. ~2% of the task signal. A
# whole solution draft moves the context far more than one appended sentence, so
# if the KL lands 10-30x higher then loss_weight 1.0 -- the reference default --
# swamps the objective. 0.05 here is deliberately small: run one step, read
# ppo_actor/opd_reverse_kl/avg, then choose. reward_clip 2.0 is what the
# instruction arms ran.
#
# Note also that actor.episode_loss_weighting scales the task advantage by
# episode token count but does NOT touch the OPD term, which is added later. So
# the task:KL ratio varies with episode length. Not a bug -- the same property
# that keeps the KL in nats -- but it is why the weight has to be small enough
# that the ratio never inverts.
#
# COST. One extra actor forward pass over the supervised turns, plus the pre-solve
# generation. Every turn of the 5-round budget is eligible here, against the
# 0.67-1.35 turns per episode the instruction arms selected, so expect
# opd/selected_turns near 4-5 and timeperf/opd_teacher_logp above their 9-17 s.
# max_turns_per_episode is the cap.
#
# WATCH IN THE FIRST FEW STEPS. gconfig.max_new_tokens caps the PRE-SOLVE as well
# as the teaching turns, via _teacher_pre_solve_tokens(), and a truncated
# derivation fails the answer judge and comes back as opd/skipped_no_presolve --
# lost supervision rather than lost episodes, because on_reject is 'continue'.
# This is why the stable arms moved to 2048: at 1024 the pre-solve skip rate ran
# 0.112 over 180 steps of 20260813_053934 and 0.321 early on 20260814_053136,
# against 0.064-0.091 on the 4096 arms. Watch teacher_pre/accepted and
# opd/skipped_no_presolve for the first few steps anyway; a third of the arm's
# signal is at stake if drafts are still being cut off.
#
# opd/skipped_overlength was identically 0.000 in every instruction arm; if it
# climbs, the draft is pushing prompts past max_train_sample_tokens.
#
# THE HONEST RISK. The privileged teacher may be the WORSE teacher. The draft
# measurably hurt teaching under the current prompt layout -- +3.1 +-3.1 pp with
# it against +12.3 +-2.5 pp under the old one -- and the mechanism was the opening
# parroting the draft at a student that was never told the problem: 20.6% of
# openings continue a conversation that never happened. The draft carries
# competence AND that pathology, and a reverse KL transfers both. If
# opd_reverse_kl is concentrated on turn 1, that is what is being distilled, and
# min_prior_failed_turns: 1 is the cheapest response.
#
# GPU BUDGET. At 4 GPUs an arm is half the node, so at most TWO run at once,
# launched a minute apart. See ../README.md.
defaults:
  - leak-local-stable@_global_
  - _self_

trial_name: 0810fc-presolve-opd

# Half of the switch. The draft is generated exactly as it is today and kept out
# of the rollout, so the rollout prompt equals a no-pre-solve arm's.
teacher_pre:
  enabled: true
  verify: true
  attempts: 3
  visibility: opd_only
  on_reject: continue
  share_per_group: true

# The other half. `instruction` is unused under context: presolve and is left
# unwritten rather than set to a value that reads as if it were still in play.
opd:
  enabled: true
  context: presolve
  loss_weight: 0.05
  reward_clip: 2.0
  min_prior_failed_turns: 0
  max_turns_per_episode: 0
  skip_leaked_rows: true

# NO PRE-SOLVE AT EVAL AT ALL, and there is no key here for it because it is not
# a choice. Under visibility: opd_only the draft has exactly two readers and both
# are out during an eval pass: the rollout preamble hides it by construction, and
# _build_opd_prompt_tokens returns None where nothing trains. The workflow
# therefore skips the generation outright (_presolve_unused_at_eval), which saves
# one teacher call per eval episode and, more to the point, makes the eval teacher
# the one that ships -- the whole claim of this arm is that the deployed model no
# longer needs a draft. teacher_pre/* is absent from eval rows as a result.
#
# The one thing that would put it back is reward.teacher_progress_judge, which
# reads the draft as a reference solution. It is off here.
