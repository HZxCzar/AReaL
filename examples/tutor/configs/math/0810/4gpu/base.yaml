# 0810 / freechat -- 4 GPUs. Allocation only; everything else comes from
# ../2gpu/base.yaml, the same way math/0808/full/4gpu builds on its 2gpu.
#
# Two GPUs for generation, two for the actor.
#
# BUDGET. CUDA_VISIBLE_DEVICES is 0..7. At 4 GPUs an arm takes half the node, so
# the two leak arms are exactly the whole node and nothing else fits alongside
# them. Stagger the two launches by a minute: forked-worker ports are allocated
# per run with no coordination between runs, and d2 doubles the forks each run
# needs. Three concurrent 4-GPU arms is what killed 20260809_1920 -- 12 GPUs
# requested against 8, all three arms produced 0 metric rows.
#
# CONCURRENCY. max_concurrent_rollouts 32, against the inherited 16.
#
# 16 is exactly one batch: a group is one problem's 8 rollouts and
# train_dataset.batch_size is 16, so at 16 the rollout has nothing left to do
# while the actor trains. 32 lets it prefetch the next batch. How far ahead it may
# actually get is bounded by max_head_offpolicyness, which is 2 and unchanged, so
# this raises overlap without raising staleness past what the trainer already
# accepts.
#
# The external callers went 16 -> 32 in ../2gpu/base.yaml, which is the thing this
# depends on: at 16 rollout slots the queue in front of the student endpoint was
# what set the step time, and doubling the rollouts without doubling the calls
# would only make that queue longer.
defaults:
  - ../2gpu/base@_global_
  - _self_

trial_name: 0810fc-base

cluster:
  n_gpus_per_node: 4

rollout:
  backend: "sglang:d2p1t1"
  max_concurrent_rollouts: 32

actor:
  backend: "fsdp:d2p1t1"

stats_logger:
  wandb:
    group: 0810-freechat-4gpu
