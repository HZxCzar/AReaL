# 0810fc-presolve-opd-frozen-w0p1-fmtlocal -- 4 GPUs. -- the frozen teacher at
# loss_weight 0.1, with the format penalty kept on the turn that earned it.
#
# RENAMED from ...-w2-fmtlocal, which ran 0.2. "w2" was a bad name twice over: the
# existing presolve-opd-w1.yaml uses "w1" for loss_weight 1.0, and the weight is no
# longer 0.2 anyway. w0p1 reads as 0.1 and cannot be confused with either.
#
# TWO KEYS differ from presolve-opd-frozen.yaml, plus one memory fix that is not a
# factor:
#
#     opd.loss_weight                0.05 -> 0.1
#     reward.turn_local_components   ["leak"] -> ["leak", "format_error"]
#     ref.mb_spec.max_tokens_per_mb  40960 -> 16384   (memory only, see the end)
#
# ---------------------------------------------------------------------------
# KEY 1 -- opd.loss_weight 0.05 -> 0.1
# ---------------------------------------------------------------------------
#
# WHY MORE THAN 0.05. It converged and then went inert. On 20260815_073714, means
# per 20-step window:
#
#     window            0-20   20-40   40-60   60-80  80-100
#     opd_reverse_kl    0.302   0.289   0.268   0.256   0.253
#     retest            0.423   0.477   0.485   0.489   0.507
#     gain vs no-draft +0.001  +0.044  +0.050  +0.045  +0.047
#     entropy           0.165   0.124   0.161   0.152   0.141
#
# The KL flattened at ~0.25 from about step 50 and the gain over the no-draft floor
# has been pinned at +0.047 for the sixty steps since, with a late slope matching
# the floor's exactly (+0.022 against +0.025). The parent's own gate was "raise only
# if it converges and the pull is too small to move retest". Both held.
#
# AND THERE IS MEASURED HEADROOM. opd_irreducible_kl_20260815 split that 0.25 on
# 200 rollouts / 49,255 tokens of this run's own traces, using its step-99
# checkpoint and the step149 teacher, all three log-probs from the same kind of
# teacher-forced forward:
#
#     kl_train recomputed     +0.212   [+0.202, +0.223]     (logged: 0.253)
#     weight gap, closeable   +0.181   [+0.171, +0.191]
#     draft gap, irreducible  +0.050   [+0.044, +0.056]
#
# Only 24% of the plateau is a floor. The unclipped terms sum exactly
# (0.4754 + 0.1406 = 0.6160), which is only possible if the token alignment is
# right, and the recomputed total sits 0.041 under the logged one in exactly the
# direction the sampler-vs-forward difference predicts. So there is 0.181 of gap
# the policy could close and has stopped closing.
#
# WHY 0.1 AND NOT 0.2 -- THIS IS MEASURED NOW, NOT ARGUED. 0.2 ran for 12 steps as
# 20260815_180105 before an unrelated OOM (see the memory section). Step-matched
# against the parent over the identical range 0-11:
#
#                        w=0.2            w=0.05
#     opd_reverse_kl     0.319 -> 0.263   0.314 -> 0.308
#     entropy            0.195 -> 0.272   0.193 -> 0.143      peak 0.289 at step 8
#     clip_ratio         0.000 -> 0.031   0.000 -> 0.008
#     grad_norm          0.093 -> 0.144   0.074 -> 0.085
#     retest, window mean        0.447            0.426
#
# Not the w=1.0 runaway -- that had the KL RISING, 0.083 -> 0.509 in seven steps
# with entropy 0.216 -> 0.441 and clip_ratio 0.274. Here the KL falls, and faster
# than the parent. But entropy at 2x the parent and a monotonically rising
# clip_ratio at 4x, with nothing yet to show for it on retest, is paying for the
# descent in the currency that killed w=1.0.
#
# The reason 4x was too big is visible in opd_advantage/min, which is exactly
# loss_weight x reward_clip: -0.400 at w=0.2 against -0.100 at w=0.05. That looks
# small beside a task-advantage spread of -10.74 to +3.40, but it is the only
# SYSTEMATICALLY SIGNED term in the objective -- GRPO's group baseline centres the
# task advantages across a problem's 8 rollouts and does not centre a per-token
# push that every rollout shares. Quadrupling a uniform downward push on sampled
# tokens is directly an entropy-increasing force, which is what the table shows.
# 0.1 doubles the pull while halving that pressure relative to 0.2, and caps the
# per-token term at -0.200.
#
# ---------------------------------------------------------------------------
# KEY 2 -- reward.turn_local_components gains "format_error"
# ---------------------------------------------------------------------------
#
# The same argument that put "leak" there. ReBN accumulates turn rewards backward
# and actor.turn_discount is 1.0, so a component raised on one turn lands
# undiscounted in the returns of every turn before it. format_error_penalty is
# -0.5, set on the offending artifact and nowhere else (core/rewards.py:135-136),
# and under the format_handling_mode: terminate this lineage sets in
# leak-local-stable.yaml, a malformed turn 5 charges -0.5 to four well-formed turns
# that had nothing to do with it. It is a cleaner case than the leak: a leak is
# arguably where a strategy the earlier turns were building toward ends up, while a
# parse failure is a property of one turn's text and nothing else.
#
# AND THE PENALTY IS THE WHOLE MISALLOCATION. The terminate branch stores
# public_history_after = public_before (workflow.py:2211) and breaks, exactly like
# leak-terminate, so the episode still earns a re-test on the transcript through
# its last completed round. The earlier turns already receive their share of a real
# outcome; the -0.5 on top is pure noise against them. Only a format error on turn
# 1 leaves no completed round, and that episode is worth the penalty alone anyway.
#
# WHEN IT ACTUALLY FIRES -- CORRECTING AN EARLIER CLAIM. An earlier version of this
# file said the key "cannot fire at this arm's rate", quoting 0.0008 per episode.
# That is the LATE rate and it is the wrong number for a short run.
# rollout/format_errors by step over the first dozen steps:
#
#     step             0      1      2      3      4      5      7     11
#     w=0.2         0.716  0.671  0.516  0.522  0.221  0.059  0.000  0.000
#     w=0.05        0.680  0.659  0.636  0.630  0.493  0.369  0.259  0.039
#
# Two thirds of episodes malformed at step 0, decaying to nothing by step 7-11. So
# over the warmup the key is highly active and only becomes inert afterwards. Read
# the arm as a weight test from roughly step 10 on; before that the two keys are
# genuinely confounded. What little evidence there is points the helpful way -- the
# 0.2 run cleared format errors three steps sooner than the parent, which is what
# not charging good turns for a malformed sibling should do.
#
# ---------------------------------------------------------------------------
# WHAT TO WATCH, AND WHEN TO KILL IT
# ---------------------------------------------------------------------------
#
# Readable by step 20-25, roughly two hours.
#
#     opd_reverse_kl/avg   must fall below 0.25 and keep going. It now has a
#                          MEASURED target of 0.05, not zero: 0.181 of the 0.25 is
#                          closeable and the rest never will be.
#     update/entropy/avg   0.14 on the parent, 0.27 at w=0.2. If this climbs past
#                          ~0.25 again while retest stays flat, then there is no
#                          operating point above 0.05 and reverse KL over sampled
#                          tokens is finished as a lever. That is a clean result.
#     update/clip_ratio    0.005-0.008 on the parent, 0.031 at w=0.2, 0.274 at the
#                          w=1.0 blowup.
#     student_original_success   floor 0.42, parent 0.507 at step 100, target 0.546.
#
# KILL RULE, on the conjunction rather than entropy alone: stop if opd_reverse_kl
# stops falling WHILE entropy is still climbing. That pair is the runaway. Entropy
# elevated on its own, with the KL still descending, is just larger updates.
#
# IF IT CONVERGES AND STILL LEAVES HEADROOM, the next lever is reward_clip, not
# more weight. The probe found clipping removes two thirds of the raw signal
# (unclipped 0.616 against clipped 0.212, with only 41% of tokens positive), so the
# mean is carried by a tail that the +-2.0 clip truncates. Raising the clip
# restores the heavy-disagreement tokens specifically instead of scaling the push
# on every token uniformly, which is the thing that raises entropy.
#
# ---------------------------------------------------------------------------
# MEMORY -- not a factor, but the reason 20260815_180105 never finished
# ---------------------------------------------------------------------------
#
# The frozen teacher is a forked process with its own caching allocator sharing the
# actor's two GPUs. Measured on that run:
#
#     actor   allocated  8.06 GB   reserved  84.80 GB
#     ref     allocated  7.71 GB   reserved  48.56 GB
#                                  ---------------------
#     device memory used/total          139.76 / 139.81 GB
#
# 50 MB free. recover.freq_secs is 3600; the run started 18:01 and at 19:08 hit its
# FIRST hourly recovery save -- _save_state_dict -> reduce_scatter -> gather_object
# -> NCCL gather, which must allocate a comm buffer. NCCL allocates with cudaMalloc
# directly, NOT from the PyTorch pool, so a card that PyTorch reports as holding
# only 8 GB "allocated" has nothing left to give it. The failed allocation surfaced
# as "NCCL Error 1: unhandled cuda error" because NCCL has no OOM error code.
#
# THIS IS SPECIFIC TO THE FROZEN-TEACHER ARMS. Across 70 runs in this experiment,
# the only two with a ref engine are the two highest-memory runs on record, 137.8
# and 139.8 GB, against a maximum of 131.2 for the other 68. The controlled pair:
# 20260814_191835_0810fc-presolve-opd-fix is the same OPD path with
# teacher_source: policy and no ref engine, and peaks at 111.45 GB. The ref engine
# is worth 28 GB.
#
# THE FIX, AND WHY IT IS NOT OFFLOAD. presolve-opd-frozen.yaml pointed at
# ref.offload plus a top-level enable_offload. That aims at the wrong tenant:
# offload moves the ref's 8 GB of WEIGHTS to CPU and pays a host transfer before
# every OPD forward, while the 48.56 GB is its ACTIVATION pool. That pool is large
# because max_tokens_per_mb was inherited from the actor, where 40960 is sized for
# a full training step; the ref only ever runs compute_logp.
#
# WHY CHANGING IT IS SAFE. mb_spec partitions work, it does not define it. A causal
# LM's logits for a sequence depend only on that sequence's own tokens, and AReaL
# packs with cu_seqlens, so nothing attends across a sequence boundary. The
# splitter does reorder -- seqpack.ffd_allocate bin-packs by length and reorder_list
# applies forward_indices -- but records backward_indices and restores the original
# row order afterwards (utils/data.py:783-784). And the ref runs under no_grad: no
# backward, no optimizer, no gradient accumulation, which is the one place a
# microbatch count can change results if per-token normalization is wrong. Not
# bit-identical, though: different packing means different GEMM shapes and so a
# different reduction order, and in bf16 that moves the last bits.
#
# 16384 IS NEAR THE FLOOR -- DO NOT DROP IT TO 8192. seqpack.ffd_allocate raises
# "Values ... is larger than capacity" when any SINGLE sequence exceeds the cap, so
# the cap must clear the longest row, not the average. ppo_actor/seq_len/max runs
# 10418 on the training layout and the ref's row is that plus the pre-solve draft
# (~1000+ tokens), so roughly 11.5-12.5k. The usable floor is about 13k. If more
# headroom is ever needed the lever is ref.offload with a top-level enable_offload,
# or PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True -- not a smaller cap.
#
# EXPECT ~110-115 GB in the Memory-Usage lines within the first few minutes. Still
# reading ~139 means the cut did not land. Reading ~112 and still dying at 67
# minutes means the OOM diagnosis is wrong and recover.freq_secs: null is the
# sidestep -- nothing is lost, the checkpoint saver still runs at 49/99/149.
#
# GPU BUDGET. At 4 GPUs an arm is half the node. Two at once, launched a minute
# apart.
defaults:
  - presolve-opd-frozen@_global_
  - _self_

trial_name: 0810fc-presolve-opd-frozen-w0p1-fmtlocal

opd:
  loss_weight: 0.1

reward:
  # "leak" is inherited from leak-local.yaml and is restated because omegaconf
  # replaces a list on merge rather than merging element-wise -- writing only
  # ["format_error"] here would silently drop the leak localization.
  turn_local_components: ["leak", "format_error"]

ref:
  # Memory only. See the MEMORY section above.
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 16384
