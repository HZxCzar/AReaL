# 4-GPU no-eval numeric-transfer run on the main leak-local-stable method.
#
# Dialogue and teacher-side checks use each accepted numeric variant; the delayed
# re-test uses the untouched source problem through retest_task and
# retest_ground_truth.
#
# The experiment method is inherited unchanged from leak-local-stable-noeval:
# local leak credit, no-teaching baseline, terminate-on-leak/format-error,
# 2048-token generation cap, episode loss weighting, and all evaluation disabled.
# This file changes only the dataset and run identifiers.
defaults:
  - leak-local-stable-noeval@_global_
  - _self_

experiment_name: tutor-math-numeric-variant-retest
trial_name: 0814fc4-numeric-variant-retest-original-noeval

train_dataset:
  path: examples/tutor/data/math_1.7b_8b/numeric_variant_retest_original_0814

valid_dataset:
  path: ${train_dataset.path}

stats_logger:
  wandb:
    group: 0814-numeric-variant-retest-4gpu-noeval
