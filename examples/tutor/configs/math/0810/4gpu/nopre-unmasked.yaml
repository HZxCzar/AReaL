# 0810fc-nopre-unmasked -- without the pre-solve, with the teacher reading its own reasoning.
#
# One key differs from leak-local-stable-nopre.yaml: teacher_history_tags. Under
# 'unmasked' each valid prior teacher reply is replayed verbatim, private
# <reasoning> included, in the TEACHER's view only; the student's conversation
# and the solo re-test still replay the public <output> text, so nothing the
# teacher thinks privately reaches the learner or the measurement.
#
# A malformed turn stores an empty string and falls back to the masked skeleton,
# so the failure 'stripped' had -- the teacher imitating its own untagged output
# -- cannot return through this path.
#
# WHAT TO WATCH. The prompt grows with depth faster than under the masked base:
# private reasoning at every round instead of a placeholder. stop/context_limit
# and ppo_actor/prompt_len (avg 2419 / max 6451 under masked) are the series
# that say whether that is costing episodes.
#
# The turn-local components are inherited from the base and are not restated:
# omegaconf replaces a list on merge, so a partial restatement here would
# silently drop one of them.
defaults:
  - leak-local-stable-nopre@_global_
  - _self_

trial_name: 0810fc-nopre-unmasked

teacher_history_tags: unmasked
