# 0810 / freechat -- teacher-first free conversation, scored only by a delayed
# solo re-test.
#
# This file is intentionally self-contained: endpoints, model, split, allocation,
# optimiser, rollout, actor and evaluation settings are all declared below.
#
# WHAT THIS CHANGES, AND WHY
#
# The answer-attempt loop told the student on every turn to solve the task and to
# box an answer, judged every reply, and stopped the episode the moment one was
# correct. Three consequences: every student reply is an answer attempt, the
# episode length is set by the student's luck rather than by the teaching, and the
# reward is one binary outcome per episode. Here:
#
#   * The teacher speaks first. No student pre-attempt, and no pre-solved short
#     circuit -- the student is never asked to solve anything during the
#     conversation, so there is nothing to be already-correct about.
#   * The pair talks for exactly free_chat.budget rounds. Nothing is judged in
#     between, so nothing ends the episode early except a leak (in terminate
#     mode), an unparsable turn (in terminate mode), or the context limit.
#   * The student is given no task, no subject and no instruction about what to
#     do. Its entire system prompt is "You are a student talking with a teacher."
#     What the conversation is about is the teacher's decision, and the student
#     first sees the problem statement at the re-test.
#   * The reward is that re-test: the conversation is replayed on an independent
#     branch and the student writes a solution from scratch. replays=4, so an
#     episode is worth 0, .25, .5, .75 or 1 -- five levels instead of two.
#
# g8k4 = gconfig.n_samples 8 rollouts per problem, 4 re-test attempts per rollout.
#
# NOTHING HERE IS COMPARABLE WITH AN EARLIER RUN. The reward is a different
# quantity, the episode length is fixed, and the student is answering a question
# it was not shown during the conversation. The headline series is
# `student_original_success` (the fraction of 4, already averaged per episode);
# `solved`, `solve_turn` and every `depth/*/resolved` series are identically zero
# by construction because there is no per-turn judge. The `depth/*/repeats` and
# `depth/*/containment_sum` halves still work -- they only read the teacher's own
# text -- so tutor repetition remains measurable.
#
# COST. Every episode now runs the full budget instead of the measured 2.1 turns,
# so this is roughly 2x the calls of an 0808/full episode: 5 teacher generations,
# 5 student calls, 4 re-test calls, 4 re-test judge calls, and up to 5 leak
# checks. Watch the student endpoint: a training step is 16 problems x 8 rollouts
# = 128 episodes x 4 re-tests = 512 student calls that all arrive at the end of
# the rollout wave, against student_models[0].max_concurrent_calls of 32.

experiment_name: tutor-math-baseline
trial_name: 0810fc2-base
seed: 42
enable_offload: false
total_train_epochs: 150
tokenizer_path: ${actor.path}
workflow: examples.tutor.workflow.TutorAgentWorkflow
eval_workflow: ${workflow}
dataset_type: math
answer_scorer: math
max_turns: 5
enable_thinking: false
leak_handling_mode: reward_only
teacher_show_ground_truth: false
teacher_anti_leak_instruction_enabled: true
student_generalize:
  enabled: true
  source: sidecar
  level1_reward: 0.0
  level2_reward: 0.0
  mode: always
  path: ''
  replays: 4
  retest_original: true
  level1_enabled: false
  level2_enabled: false
  retest_reward: 1.0
teacher_pre:
  enabled: true
  mode: filter_solver
  attempts: 3
  max_tokens: 0
  verify: true
auxiliary_model:
  mode: api
  enable_thinking: false
  base_url: ${oc.env:TUTOR_QWEN3_8B_BASE_URL}
  model: qwen3-8b
  api_key: ${oc.env:INF_API_KEY}
  timeout: 120
  max_tokens: 1024
  temperature: 0.0
  top_p: 1.0
  max_concurrent_calls: 32
  request_params:
    seed: 42
    extra_headers:
      x-inspire-inference-key: tutor-train-qwen8b-auxiliary
    extra_body:
      top_k: 20
      min_p: 0
      chat_template_kwargs:
        enable_thinking: false
  answer_judge_enabled: true
  answer_judge_max_tokens: 256
student_models:
- name: qwen3-1.7b
  weight: 1.0
  base_url: ${oc.env:TUTOR_QWEN3_1_7B_BASE_URL}
  model: qwen3-1.7b
  api_key: ${auxiliary_model.api_key}
  timeout: 120
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.8
  max_concurrent_calls: 32
  request_params:
    seed: 42
    extra_headers:
      x-inspire-inference-key: tutor-train-qwen17b-student
    extra_body:
      top_k: 20
      min_p: 0
      chat_template_kwargs:
        enable_thinking: false
- name: llama-3.1-8b-instruct
  weight: 0.0
  base_url: ${oc.env:TUTOR_LLAMA31_8B_BASE_URL}
  model: llama-3.1-8b-instruct
  api_key: ${auxiliary_model.api_key}
  timeout: 120
  max_tokens: 2048
  temperature: 0.6
  top_p: 0.9
  max_concurrent_calls: 32
  request_params:
    seed: 42
    extra_headers:
      x-inspire-inference-key: tutor-train-llama31-8b-student
- name: gemma-3-1b-it
  weight: 0.0
  base_url: ${oc.env:TUTOR_GEMMA3_1B_BASE_URL}
  model: gemma-3-1b-it
  api_key: ${auxiliary_model.api_key}
  timeout: 120
  max_tokens: 2048
  temperature: 0.0
  top_p: null
  max_concurrent_calls: 32
  request_params:
    seed: 42
    extra_headers:
      x-inspire-inference-key: tutor-train-gemma3-1b-student
    extra_body:
      repetition_penalty: 1.05
reward:
  format_error_penalty: -0.5
  success: 0.0
  leak_penalty_mode: rawbase
  assign_success_reward: false
  leak_penalty: -1.0
  leak_penalty_aggregation: episode
  outcome_prior_turn_weight: 0.5
  outcome_credit_gamma: 0.9
  early_success_bonus: 0.0
  max_turn_penalty: 0.0
  enable_turn_penalty: false
  turn_penalty: -0.01
  length_penalty_threshold_chars: 0
  length_penalty_per_100_chars: 0.0
  length_penalty_min: 0.0
  # Lists replace on merge; spelling out both components preserves leak-local.
  turn_local_components: ["leak", "format_error"]

debug_trace_dir: /inspire/qb-ilm/project/qproject-fundationmodel/public/wxxu/TAgent/output/tutor/debug_traces/${experiment_name}/${trial_name}
debug_trace_every_n_rollouts: 10
cluster:
  n_nodes: 1
  n_gpus_per_node: 2
  fileroot: /inspire/qb-ilm/project/qproject-fundationmodel/public/wxxu/TAgent/output/tutor
  name_resolve:
    type: nfs
    nfs_record_root: /inspire/qb-ilm/project/qproject-fundationmodel/public/wxxu/TAgent/output/tutor/name_resolve
scheduler:
  type: local
rollout:
  backend: sglang:d1p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 16
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  pause_grace_period: 10
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  use_lora: true
  dump_to_file: true
  openai:
    mode: inline
    tool_call_parser: qwen25
    reasoning_parser: qwen3
    chat_template_type: concat
    export_style: concat
    turn_discount: 1.0
gconfig:
  n_samples: 8
  min_new_tokens: 0
  max_new_tokens: 4096
  max_tokens: 24576
  greedy: false
  temperature: 0.7
  top_p: 1.0
  lora_name: default_lora
eval_gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 4096
  max_tokens: 24576
  greedy: false
  temperature: 0.7
  top_p: 1.0
  lora_name: default_lora
actor:
  backend: fsdp:d1p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /inspire/hdd/project/qproject-fundationmodel/public/wxxu/.cache/huggingface/hub/models--Qwen--Qwen3-8B/snapshots/b968826d9c46dd6066d109eabc6255188de91218
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 40960
  optimizer:
    type: adam
    lr: 5.0e-05
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  use_ppo_clip: true
  # DUAL CLIPPING. Without this the negative branch of the PPO objective is
  # unbounded, and that is what destroyed 20260816_070410 at step 195.
  #
  # For a NEGATIVE advantage, pg_loss1 = |A| * ratio grows without limit as the
  # ratio grows, and the pessimistic max() selects exactly that branch once the
  # ratio passes 1 + eps_clip. eps_clip bounds the term the max() discards, not
  # the one it keeps, so it is no protection here. One batch carrying a cluster of
  # large negative advantages therefore drives those tokens' log-probs toward
  # minus infinity in a single update.
  #
  # Measured, per step, on that run: format errors had risen to 0.168/episode by
  # 193, each -0.5 and concentrated on one turn by turn_local_components, giving
  # an advantage minimum of -3.5 against a batch mean of -0.38. Then
  #
  #   step 193   clip_ratio 0.015   approx_kl -0.023   imp_weight min 2.9e-07
  #   step 194   clip_ratio 0.037   approx_kl -0.098   imp_weight min 6.5e-14
  #   step 195   clip_ratio 0.153   approx_kl -1.288   imp_weight min 5.3e-19
  #   step 196   clip_ratio 0.331   approx_kl -1.943   imp_weight min 1.1e-43
  #
  # An importance weight of 1e-43 is a token the policy now assigns essentially
  # zero probability while the behaviour policy had just sampled it. Probability
  # mass has to go somewhere, so it spread across the vocabulary: entropy went
  # 0.105 -> 0.608 -> 4.2 -> 9.8 over four steps, format errors reached 0.78, and
  # 84% of episodes were dropped at the pre-solve filter.
  #
  # AND THE COLLAPSE IS ONE-WAY without this. behave_imp_weight_mode is
  # 'token_mask' with cap 5.0, which zeroes any token whose ratio exceeded the
  # cap -- after the jump that is most of them, so the samples carrying the
  # correction were discarded. Mean importance weight fell to 0.21 by step 198:
  # four fifths of the gradient signal gone, and the fifth that remained was the
  # part the broken policy already agreed with.
  #
  # 3.0 bounds a single example's downward push at 3 * |A| instead of unbounded.
  # It costs nothing when the policy is healthy -- dual_clipped_tokens stays near
  # zero -- so this is a guard rail, not a tuning change.
  c_clip: 3.0
  advantage_estimator: rebn
  turn_discount: 1.0
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 4
  recompute_logprob: true
  use_decoupled_loss: true
  behave_imp_weight_cap: 5.0
  reward_norm: null
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: disk
  use_lora: ${rollout.use_lora}
  peft_type: lora
  lora_rank: 16
  lora_alpha: 16
  target_modules:
  - all-linear
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
  - task_type: worker
    port_count: 2
    gpu: 1
    cmd: python3 -m areal.infra.rpc.rpc_server
    env_vars: {}
  group_baseline: episode
  group_baseline_leave1out: true
  episode_loss_weighting: false
  num_iterations: 2
ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 40960
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: 32
  context_length: 40960
  mem_fraction_static: 0.75
  enable_lora: ${actor.use_lora}
  max_lora_rank: ${actor.lora_rank}
  max_loaded_loras: 16
train_dataset:
  batch_size: 16
  shuffle: true
  pin_memory: false
  num_workers: 0
  path: examples/tutor/data/math_1.7b_8b/math_pass@2
  type: rl
  max_length: 16384
valid_dataset:
  batch_size: ${train_dataset.batch_size}
  pin_memory: false
  num_workers: 0
  path: examples/tutor/data/math_1.7b_8b/math_pass@2
  type: rl
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 50
  freq_secs: null
recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 10
  freq_steps: null
  freq_secs: 3600
evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 25
  freq_secs: null
  max_samples: null
  average_rollouts: 1
  student_model_names:
  - qwen3-1.7b
  teacher_pre_verify: false
  leak_terminate: false
  # Same argument, for the same reason: terminating on a malformed turn is a
  # training policy, and nothing cuts a real conversation short because the
  # teacher mis-tagged a reply. The rate is still reported by format_errors.
  # Under terminate the step-0 eval of 20260814_053136 ended 83.5% of episodes
  # on a format error and only 16.5% reached the budget -- and that pass is the
  # baseline every later point is read against.
  format_terminate: false
stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: offline
    entity: hz-czar-stanford
    project: TAgent
    name: ${trial_name}
    group: 0810-freechat-2gpu
format_handling_mode: continue
total_train_steps: 500
free_chat:
  enabled: true
  budget: 5
# THE TEACHER SIDE, and it is a different axis from the student masks below. This
# is how the teacher sees ITS OWN earlier replies; student_models[*].mask is what
# the STUDENT sees of the dialogue. They share nothing but the word.
#
# 'unmasked' replays each valid prior teacher reply verbatim, private <reasoning>
# included, in the teacher view only -- the student conversation and the solo
# re-test still replay the public <output> text, so nothing the teacher thinks
# privately reaches the learner or the measurement.
#
# WAS 'masked' UNTIL 20260817, and runs before that are not continuous with runs
# after it on the format-error series. 'masked' handed the tag skeleton back with
# the reasoning replaced by a placeholder, which was itself a fix for 'stripped':
# under stripped the teacher read its own untagged replies and imitated them,
# 6.3% malformed at depth 1 rising to 41.7% at depth 5 on 20260810_234129.
# 'unmasked' is at least as safe on that axis, because the real tags are present
# verbatim rather than as a skeleton, and a malformed turn stores an empty string
# and falls back to the skeleton so the stripped failure cannot return.
#
# WHAT IT COSTS. The prompt grows with depth faster than under masked -- private
# reasoning at every round instead of a placeholder. There is a graceful guard
# (stop/context_limit), so watch that series and ppo_actor/prompt_len; the latter
# ran avg 2419 / max 6451 under masked.
#
# cross_eval.free_chat.teacher_history_tags must equal this or the workflow raises
# at startup: the ped comparison would otherwise measure the setting, not the
# teacher.
teacher_history_tags: unmasked
