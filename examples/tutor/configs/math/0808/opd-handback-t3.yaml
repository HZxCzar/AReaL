# 0808-opd-handback-t3 -- opd-handback distillation, but only from turn 3.
#
# Same machinery as opd.yaml -- rollout untouched and on-policy, the same weights
# re-run teacher-forced with the instruction, per-token reverse KL subtracted from
# the advantage. Two things differ, both because the instruction is about a
# different failure.
#
# What it targets. On the 30-task collection dump, gemini taught the same 1.7b
# student successfully WITHOUT ever stating the answer on 83% of tasks; every qwen
# arm managed 27-50%. Paired on the same tasks that is +33 to +57 points with
# every interval clear of zero. The three qwen arms that reach 100% "success" buy
# it by leaking: trained_leak0 leaks on 73% of episodes, trained_leak1 on 57%.
# leakt already terminates the episode on a leak, which drops its leak rate to
# 23% -- and its success rate to 57%. So the reward can already make the policy
# stop leaking; what it cannot do is supply the thing gemini replaces the leak
# with. That is what this arm tries to move into the weights.
#
# Difference 1: no turn gate. The repair instruction claims the previous message
# failed, so it can only be applied once that is true. This one claims nothing
# about the history, and the gap it targets is in the FIRST message: 80% of
# gemini's episodes end within two turns. Gating at turn 3 would apply it almost
# nowhere. max_turns_per_episode stays at 2, so this supervises turns 1 and 2.
#
# Difference 2: none. Everything else is copied from opd.yaml deliberately, so
# opd vs opd-handback isolates the wording and opd-handback vs baseline measures
# the arm.
#
# Read it against baseline.yaml for "did it help" and against opd.yaml for "was
# the repair wording the wrong target". There is no prompt-handback control here;
# add one before claiming distillation specifically was necessary.
defaults:
  - /math/0805/v2/qwen8b-train-qwen1.7b-eval3-math-pre-aleak-generated-g8k4-leakt@_global_
  - _self_

hydra:
  searchpath:
    - file://examples/tutor/configs

trial_name: 0808-opd-handback-t3

# Stop after 100 optimizer steps, whatever the epoch count works out to.
#
# total_train_epochs stays at the inherited 150 and only sizes the loop;
# rl_trainer.py:1236 breaks on global_step >= total_train_steps first, so the
# loop runs global_step 0..99 -- exactly 100 steps -- and saver and evaluator
# fire on their usual cadence inside that.
#
# This does not distort the learning rate. lr_scheduler_type is constant, so
# total_train_steps only scales num_warmup_steps, which at
# warmup_steps_proportion 0.001 rounds to under one step either way. Setting it
# under a cosine or linear schedule would NOT be safe: the schedule length comes
# from ft_spec, not from this, and the run would stop partway down the curve.
total_train_steps: 100


opd:
  enabled: true
  # 1.0 is the reference default, and the reference runs OPD as a STANDALONE
  # distillation phase where the KL is the whole objective. Run jointly with GRPO
  # it is a scale error, and the first attempt collapsed on exactly that: the task
  # advantage is normalised to roughly unit scale by actor.adv_norm, this term is
  # added afterwards in raw nats, and opd_advantage reached -17. The policy stopped
  # emitting the output-format tags within ~30 steps, every turn became a format
  # error, episodes ran to max_turns and reward fell to -3.2.
  #
  # None of the existing clips reach it: actor.reward_clip acts on the task reward
  # before rebn, eps_clip bounds the ratio rather than the advantage,
  # behave_imp_weight_cap bounds the off-policy weight, and gradient_clipping
  # rescales the whole gradient instead of dropping outliers -- so oversized
  # tokens crowd the task signal out rather than being trimmed.
  #
  # 0.1 with reward_clip 2.0 bounds one token's contribution to +-0.2, about a
  # fifth of the task advantage. Watch opd_advantage/min and /max: they must stay
  # inside +-0.2, rollout/format_errors must stay at 0, and opd_reverse_kl/avg
  # should still trend toward 0 or the term is too weak to distil anything.
  loss_weight: 0.1
  # Named, not copied: prompts.TEACHER_HANDBACK_INSTRUCTION. An unknown name
  # raises at config load rather than training on the literal string.
  instruction: "@handback"
  # Supervise from turn 3 instead of turn 1. With max_turns_per_episode 2 that
  # is turns 3-4: min_prior_failed_turns decides which turns are ELIGIBLE
  # (turn_idx - 1 >= threshold) and the cap then takes the first two of them.
  #
  # Paired against opd-handback.yaml, which differs in this one value, so the two
  # ask whether it is worth more to distil the turns where most episodes end or
  # the turns where the tutor is already stuck. On the late-window traces that
  # is 290 supervised turns per 600 episodes here against 664 at gate 0, and
  # roughly a third of these 290 sit in episodes that run to the turn cap and
  # never succeed whatever is said in them.
  min_prior_failed_turns: 2
  # Turns 1 and 2, which is where 70-83% of episodes end across all five models.
  max_turns_per_episode: 2
  # The reference does not clip, but the reference is not competing with a task
  # advantage either. Without this a single token reached -17 nats.
  reward_clip: 2.0
  skip_guided_rows: true
  # Kept true even though the leaked rows are the ones this instruction most
  # obviously disagrees with. Under leakt a leak already ends the episode with a
  # terminal penalty, and stacking an unclipped reverse KL on those same tokens is
  # the cheapest way to get a collapse. Suppressing leaks does not require
  # supervising the leaks themselves: the instructed teacher assigns low
  # probability to "the correct value is X" on every turn, not just that one.
  # This is the first knob to flip if opd/selected_ratio comes out starved.
  skip_leaked_rows: true

stats_logger:
  wandb:
    group: 0808-instruction-2x2
