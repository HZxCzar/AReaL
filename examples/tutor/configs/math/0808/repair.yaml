# Control arm for OPD: the instruction stays in the prompt.
#
# Same wording as the OPD arm, same turn gate, applied to every rollout. It is
# present when the turn is generated, present in the prompt the turn is trained
# on, and present at evaluation. Nothing is stripped, nothing is distilled, and no
# part of the turn is off-policy -- the only difference from baseline is that the
# teacher is told this at turn 3 onward.
#
# Its job is to make "OPD worked" mean something. Appending a sentence to a prompt
# is free, so OPD has to beat that rather than beat nothing. If this arm lands on
# baseline, the +7.9% measured on the untrained policy was only ever a better
# starting point and the whole line of work stops here.
#
# Placement is inside the mechanism, not this file: the instruction goes at the
# end of the SYSTEM prompt. It cannot go at the end of the message list -- the
# teacher's prompt is a real conversation, its own turns assistant and the
# student's user, so appending a directive there would put words in the student's
# mouth and leave some student turns carrying an instruction while earlier ones do
# not. teacher_system_prompt itself is untouched and stays identical across all
# three arms; the instruction is added per turn on top of it.
defaults:
  - /math/0805/v2/qwen8b-train-qwen1.7b-eval3-math-pre-aleak-generated-g8k4-leakt@_global_
  - _self_

hydra:
  searchpath:
    - file://examples/tutor/configs

trial_name: 0808-repair

# Stop after 100 optimizer steps, whatever the epoch count works out to.
#
# total_train_epochs stays at the inherited 150 and only sizes the loop;
# rl_trainer.py:1236 breaks on global_step >= total_train_steps first, so the
# loop runs global_step 0..99 -- exactly 100 steps -- and saver and evaluator
# fire on their usual cadence inside that.
#
# This does not distort the learning rate. lr_scheduler_type is constant, so
# total_train_steps only scales num_warmup_steps, which at
# warmup_steps_proportion 0.001 rounds to under one step either way. Setting it
# under a cosine or linear schedule would NOT be safe: the schedule length comes
# from ft_spec, not from this, and the run would stop partway down the curve.
total_train_steps: 100


prompt_instruction:
  enabled: true
  # Empty uses prompts.TEACHER_REPAIR_INSTRUCTION, the exact wording every
  # measurement was taken against. Do not paraphrase it here.
  instruction: "@repair"
  # Every arm carries its instruction from turn 1. The repair wording opens with
  # "Your previous message did not get through", which is false on turn 1 -- kept
  # anyway, because every offline measurement was taken against that exact string
  # and the effect did not need the premise to be true (+7.5% on states where the
  # student was improving rather than stuck).
  min_prior_failed_turns: 0

stats_logger:
  wandb:
    group: 0808-instruction-2x2
