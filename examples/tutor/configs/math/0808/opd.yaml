# On-policy distillation of the repair instruction into the weights.
#
# The rollout is untouched and fully on-policy -- no instruction anywhere. The
# same weights are then run teacher-forced over the policy's own tokens with the
# instruction appended, giving a per-token reverse KL on the sampled tokens,
# log pi_sampled - log pi_teacher. That is subtracted from the per-token advantage
# with coefficient loss_weight and the ordinary importance-sampling loss runs
# unchanged, so the signal inherits the PPO ratio and clipping. Discount factor
# zero: the penalty lands on the token that produced it and never enters GAE.
# This follows tinker_cookbook/distillation/train_on_policy.py.
#
# Teacher and policy are the same weights and differ only by the instruction, so
# what ends up in the parameters is the effect of the instruction. The term is
# self-limiting: it goes to zero once the policy already behaves that way
# unprompted. Cost is one extra forward pass over the supervised turns; nothing is
# sampled from the teacher and the 1.7b student is not called again.
#
# Compare against prompt.yaml, not against baseline.yaml.
defaults:
  - /math/0805/v2/qwen8b-train-qwen1.7b-eval3-math-pre-aleak-generated-g8k4-leakt@_global_
  - _self_

hydra:
  searchpath:
    - file://examples/tutor/configs

trial_name: 0808-opd

opd:
  enabled: true
  # The reference implementation's kl_penalty_coef, whose default is also 1.0.
  # Its scale comes from the KL being in nats, not from the task reward, so it is
  # not comparable to a loss weight and 1.0 is a starting point rather than a
  # tuned value. Watch opd_reverse_kl: if it sits flat and far from zero the
  # instruction is not being absorbed and this is the knob.
  loss_weight: 1.0
  instruction: ""
  # Turn 3 onward. Must match prompt.yaml's gate.
  #
  # Deliberately not a judge. Splitting the measured +7.9% by a full-history
  # diagnosis of the same states showed no discrimination on any axis available:
  # student circling +8.3% vs improving +7.5% (difference -0.9% [-8.3, +6.4]),
  # tutor repeating +8.2% vs not +7.7% (-0.5% [-8.7, +7.5]), and flat in how many
  # rounds had already failed (k=3 +6.6%, k=6 +8.4%). The instruction helps just
  # as much when the student is making progress, so its value does not come from
  # its premise being literally true, and an aux call per turn would buy nothing.
  min_prior_failed_turns: 2
  # Every measurement applied the instruction ONCE at ONE state. Nothing says what
  # repeated application does, and there is a floor to how fine a step can get.
  # Two per episode keeps the signal while bounding that risk; raise it once
  # opd_reverse_kl is seen converging.
  max_turns_per_episode: 2
  # The reference does not clip. 0 keeps that; raise it only if a single outlier
  # token is seen dominating opd_advantage.
  reward_clip: 0.0
  skip_guided_rows: true
  skip_leaked_rows: true

stats_logger:
  wandb:
    group: 0808-repair-instruction
