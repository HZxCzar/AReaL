# 0808f-decompose -- decompose clause in the prompt, orders 3-10.
#
# The arm that makes "OPD worked" mean something. Appending a sentence to a
# system prompt is free, so the distilled arm has to beat THIS, not beat
# baseline. If this lands on baseline, the sentence only ever raised the
# starting point and the line of work stops.
#
# Present when the turn is generated, present in the prompt the turn is trained
# on, present at evaluation. Nothing is stripped and no part of the turn is
# off-policy: the only difference from baseline is that the teacher is told this
# from turn 3 on.
#
# Placement is inside the mechanism, not this file: the instruction goes at the
# end of the SYSTEM prompt. It cannot go at the end of the message list -- the
# teacher's prompt is a real conversation, its own turns assistant and the
# student's user, so a directive appended there would be attributed to the
# student.
#
# GATE 2, NOT 0
#
# math/0808/decompose.yaml uses gate 0 and therefore carries the instruction on
# every turn. Paired against an OPD arm gated at turn 3, that compares two
# different coverages as well as two placements. Here both arms gate at 2:
#
#   prompt_instruction, gate 2, no cap      orders 3-10   45.4% of tutor turns
#   opd, gate 2, cap 0                      orders 3-10   45.4%
#
# prompt_instruction has no per-episode cap, so gate alone lines the two up.
# prompt_instruction/share_of_turns and opd/selected_ratio should come back
# within a point or two of each other; if they do not, the comparison is not
# clean and neither number means anything.
defaults:
  - /math/0805/v2/qwen8b-train-qwen1.7b-eval3-math-pre-aleak-g8k4-leakt-full@_global_
  - _self_

hydra:
  searchpath:
    - file://examples/tutor/configs

trial_name: 0808f-decompose

total_train_steps: 100

prompt_instruction:
  enabled: true
  # Decompose clause only. Measured apart from the other two clauses over 264
  # states: decompose alone +2.4% [+0.3, +4.5], and +4.3% [+1.3, +7.5] where the
  # tutor had just repeated itself -- the subgroup these arms target. The
  # anti-repeat clause added +0.5% [-1.9, +2.9] on top, did not lower the repeat
  # rate of the turn it produced, and made output unparsable 17.6% of the time
  # against 9.8%. It stays out.
  instruction: "@decompose"
  # turn_idx is 1-based and the gate is `turn_idx - 1 >= this`, so 2 means the
  # instruction appears from order 3 on -- where the repeat rate crosses 20% and
  # the resolve rate starts collapsing. Matches opd.min_prior_failed_turns in
  # the OPD arms.
  min_prior_failed_turns: 2

stats_logger:
  wandb:
    group: 0808-full-split
