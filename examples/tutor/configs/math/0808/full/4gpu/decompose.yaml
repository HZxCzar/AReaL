# 0808f-decompose -- decompose clause in the prompt, depth 3-10.
#
# The arm that makes "OPD worked" mean something: appending a sentence to a
# system prompt is free, so the distilled arm has to beat THIS, not baseline. If
# this lands on baseline, the sentence only ever raised the starting point.
#
# Gate 2, not 0. math/0808/decompose.yaml carries the instruction on every turn;
# paired against an OPD arm gated at turn 3 that compares two coverages as well
# as two placements. prompt_instruction has no per-episode cap, so gate 2 alone
# covers depth 3-10 -- the same 45.4% of turns as opd-decompose.
# prompt_instruction/share_of_turns and opd/selected_ratio should agree within a
# point or two, or the comparison is not clean.
defaults:
  - base@_global_
  - _self_

trial_name: 0808f-decompose

prompt_instruction:
  enabled: true
  # Decompose clause only. Measured apart from the other two clauses over 264
  # states: decompose alone +2.4% [+0.3, +4.5], and +4.3% [+1.3, +7.5] where the
  # tutor had just repeated itself. The anti-repeat clause added +0.5%
  # [-1.9, +2.9] on top, did not lower the repeat rate of the turn it produced,
  # and made output unparsable 17.6% of the time against 9.8%.
  instruction: "@decompose"
  # turn_idx is 1-based and the gate is turn_idx - 1 >= this, so 2 means depth 3
  # onward -- where the repeat rate crosses 20% and the hazard starts collapsing.
  min_prior_failed_turns: 2

stats_logger:
  wandb:
    group: 0808-full-4gpu
