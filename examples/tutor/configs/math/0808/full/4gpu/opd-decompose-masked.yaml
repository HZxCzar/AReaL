# 0808f-opd-decompose-masked -- opd-decompose with the teacher's own turns
# tagged again.
#
# One line differs from opd-decompose.yaml: teacher_history_tags: masked. The
# whole opd block below is copied from it verbatim; if that file changes, change
# this one with it or the pair stops being a single-variable comparison.
#
# WHY THIS ARM AND NOT JUST THE BASELINE ONE
#
# 1. The step-44 collapse was a FORMAT collapse. On 20260809_051324 this arm
#    broke at step 44: opd_reverse_kl/avg ran 0.005 -> 0.133 without plateauing
#    while cap2 settled at 0.018, clipped_tokens drifted 337 -> 955 -> 2460
#    against cap2's 87-241, and the output format broke. Teaching quality on the
#    well-formed turns was unchanged throughout (17.7% -> 18.3%) -- structural,
#    not a loss of capability. masked attacks precisely the channel that failed.
#    It is a hypothesis, not a fix: nothing here stops the KL drift itself, and
#    if this arm survives past step 44 that alone will not say whether masked or
#    run-to-run variance did it. The control run is what says that.
#
# 2. It decides what opd-decompose vs decompose actually measures. Restricted to
#    turns the parser could read, the decompose instruction's advantage over no
#    instruction largely disappears -- W:hazard_d3_exact -2.41 [-6.71, +2.44] ns,
#    W:hazard_deep -1.55 [-3.40, +0.45] ns -- while unrestricted it halves the
#    format failure at depth 3, 9.0% against 21.4%, +12.41 pp [+5.83, +19.15]
#    under both estimators. So most of what the instruction buys on this policy
#    is a parseable turn, not better pedagogy
#    (analysis/context_instruction_20260809/RESULTS.md). That matters here
#    because the instruction is in the prompt at inference in the decompose arm
#    and absent by construction in the OPD arm: if format anchoring is the
#    dominant channel, it is exactly the part distillation cannot carry, and the
#    placement comparison is partly a comparison of format crutches. Removing
#    the format channel is what makes it a comparison of teaching.
#
# The bug, the mechanism and the caveats are documented in baseline-masked.yaml;
# they are not repeated here. The short version: public_history hands the
# teacher its own turns with the tags stripped and it copies them, 2.1%
# malformed at depth 1 rising to 73.4% at depth 10, 432 of 685 malformed turns
# carrying no tags at all. Observation side only -- reward and sampling are
# untouched.
#
# WHAT THE CONTROL IS. 4gpu/opd-decompose.yaml.
#
# WHAT TO WATCH, in order
#
#   opd_reverse_kl/avg          above 0.05 and still climbing, expect a break
#                               within ~10 steps. This is still the leading
#                               indicator and masked is not expected to change
#                               it directly.
#   stop/format_error           the target, and on this arm also the collapse
#                               symptom
#   ppo_actor/update/clipped_tokens     drifted 337 -> 955 -> 2460 into the
#                                       collapse; cap2 stayed at 87-241
#   opd/selected_ratio          should sit at ~45.4%, as in opd-decompose
#   opd_advantage/min, /max     inside +-0.2
#   length of the <reasoning> section   the placeholder-imitation risk
#
# Fall back to opd-decompose-cap2, not to gate 0.
defaults:
  - base@_global_
  - _self_

trial_name: 0808f-opd-decompose-masked

# The one line that differs from opd-decompose.yaml.
teacher_history_tags: masked

# Copied verbatim from opd-decompose.yaml. Keep them identical.
opd:
  enabled: true
  # 1.0 is the reference default, but the reference runs OPD standalone where
  # the KL is the whole objective. Joint with GRPO that is a scale error: the
  # task advantage is normalised to about unit scale by actor.adv_norm and this
  # term is added afterwards in raw nats. The first attempt reached
  # opd_advantage -17 and lost the output-format tags within ~30 steps.
  loss_weight: 0.1
  instruction: "@decompose"
  # Matches prompt_instruction.min_prior_failed_turns in decompose.yaml, so the
  # two arms see the instruction on the same turns.
  min_prior_failed_turns: 2
  # 0 disables the cap: workflow.py:4314 tests
  # `self.opd_max_turns_per_episode and selected >= ...` and 0 is falsy. The one
  # line that differs from opd-decompose-cap2.yaml.
  max_turns_per_episode: 0
  # Bounds one token's contribution to +-0.2 at loss_weight 0.1.
  reward_clip: 2.0
  skip_guided_rows: true
  # Leaked rows are excluded to avoid stacking an unclipped KL on tokens that
  # already carry a terminal penalty. That removes 7.9% of turns overall.
  skip_leaked_rows: true

stats_logger:
  wandb:
    group: 0808-full-4gpu
