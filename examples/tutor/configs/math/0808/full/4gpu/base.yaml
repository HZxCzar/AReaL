# 0808 / full -- 4 GPUs. Allocation only; everything else comes from
# ../2gpu/base.yaml, the same way math/0723/4gpu builds on math/0723/2gpu.
#
# Two for generation, two for the actor.
#
# BUDGET. CUDA_VISIBLE_DEVICES is 0..7. At 4 GPUs an arm takes half the node, so
# run at most TWO of these at once. Three at once is what killed
# 20260809_1920 -- 12 GPUs requested against 8, and the eval-rollout workers
# could not bind their forked ports. Stagger launches by a minute: forked-worker
# ports are allocated per run with no coordination between runs, and d2 doubles
# the forks each run needs.
#
# rollout.max_concurrent_rollouts stays at the inherited 16. It is bounded by the
# answer judge, not by GPUs, and 128 is what made the 20260801 runs drop 483/616
# rollouts.
defaults:
  - ../2gpu/base@_global_
  - _self_

trial_name: 0808f-base-4gpu

cluster:
  n_gpus_per_node: 4

rollout:
  backend: "sglang:d2p1t1"

actor:
  backend: "fsdp:d2p1t1"
