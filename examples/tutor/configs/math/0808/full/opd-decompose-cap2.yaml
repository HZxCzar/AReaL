# 0808f-opd-decompose-cap2 -- the cap ablation. OPTIONAL.
#
# Identical to opd-decompose.yaml except max_turns_per_episode is 2 instead of
# 0, so OPD supervises orders 3-4 only:
#
#   opd-decompose        orders 3-10   1430 turns   45.4% of tutor turns
#   this file            orders 3-4     628 turns   19.9%
#
# Only worth running once opd-decompose has beaten decompose. It answers the
# follow-up -- was it reaching the stuck turns at all, or was it reaching ALL of
# them? -- and nothing else. If opd-decompose lands on decompose, this arm has
# no question to answer.
#
# It is also the arm that breaks coverage parity on purpose: at 19.9% against
# the prompt arm's 45.4% it is NOT a clean placement comparison, and it should
# be read only against opd-decompose.
defaults:
  - /math/0805/v2/qwen8b-train-qwen1.7b-eval3-math-pre-aleak-g8k4-leakt-full@_global_
  - _self_

hydra:
  searchpath:
    - file://examples/tutor/configs

trial_name: 0808f-opd-decompose-cap2

total_train_steps: 100

opd:
  enabled: true
  loss_weight: 0.1
  instruction: "@decompose"
  min_prior_failed_turns: 2
  # The one line that differs from opd-decompose.yaml.
  max_turns_per_episode: 2
  reward_clip: 2.0
  skip_guided_rows: true
  skip_leaked_rows: true

stats_logger:
  wandb:
    group: 0808-full-split
