# Match the original 0901 reward-v3 experiment, with small fixed penalties for
# leak-masked and personality-gated teacher turns. Improvement credit remains
# gate-pass-only and uses the turn-level leave-one-out baseline.
leak_handling_mode: masked_continue

personality:
  explain_ratio: 1.0

student_generalize:
  gate_pass_credit_only: true

actor:
  group_baseline: episode
  group_baseline_leave1out: true
  group_baseline_local_reward_mode: exclude
  adv_norm:
    mean_level: null
    std_level: batch

reward:
  leak_penalty: -0.1
  personality_gate_fail_penalty: -0.1
  # Lists replace on merge, so retain the 0901 format/repeat components while
  # adding personality gate failure as another turn-local component.
  turn_local_components:
    [
      "leak",
      "format_error",
      "teacher_exact_repeat",
      "soft_overlong",
      "personality_gate_fail",
    ]
  turn_local_component_placements:
    leak: post_std
    format_error: post_std
    teacher_exact_repeat: post_std
    soft_overlong: post_std
    personality_gate_fail: post_std
