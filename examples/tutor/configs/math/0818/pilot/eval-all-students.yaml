# Standalone evaluation pool for the 0818 information-specialist pilot.
#
# Keep this independent of base/full.yaml: that file is an active experiment arm,
# while this file is a frozen measurement surface containing the complete 2 x 4
# student product. Training is never launched from this config.
defaults:
  - ../base/default@_global_
  - _self_

trial_name: 0818-information-specialist-pilot-eval

student_models: []
student_axes:
- behaviors: [text, code]
  informations:
    original:
      mode: full
    student_fade:
      mode: student_fade
      keep_recent: 0
    teacher_fade:
      mode: teacher_fade
      keep_recent: 0
    long_drop:
      mode: long_drop
      long_drop_words: 50
  template:
    name: qwen3-1.7b
    weight: 1.0
    base_url: ${oc.env:TUTOR_QWEN3_1_7B_BASE_URL}
    model: qwen3-1.7b
    api_key: ${auxiliary_model.api_key}
    timeout: 120
    max_tokens: 2048
    temperature: 0.7
    top_p: 0.8
    max_concurrent_calls: 32
    request_params:
      seed: 42
      extra_headers:
        x-inspire-inference-key: tutor-eval-qwen17b-student
      extra_body:
        top_k: 20
        min_p: 0
        chat_template_kwargs:
          enable_thinking: false

# Four re-tests retain the same expected score as training's eight while making a
# screening matrix affordable. Final experiments should return to eight.
student_generalize:
  replays: 4

student_type_probe:
  enabled: false

evaluator:
  teacher_pre_enabled: true
  teacher_pre_verify: false
  leak_terminate: false
  format_terminate: false
  average_rollouts: 1

