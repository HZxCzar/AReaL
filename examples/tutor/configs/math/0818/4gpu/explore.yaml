# The exploration arm at 4 GPUs. Composition only: what the arm does comes from
# base/explore.yaml, how many GPUs it gets from alloc.yaml, and this file adds
# nothing but the name.
defaults:
  - ../base/explore@_global_
  - alloc@_global_
  - _self_

trial_name: 0818-explore-noeval-4gpu

stats_logger:
  wandb:
    group: 0818-4gpu
