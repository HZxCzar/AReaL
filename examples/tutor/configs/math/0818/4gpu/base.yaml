# The default arm at 4 GPUs. Composition only: the settings come from
# base/default.yaml and the GPU numbers from alloc.yaml, and this file adds nothing
# but the name.
#
# Every arm follows this shape -- base/<arm> for what it does, <n>gpu/alloc for how
# many GPUs it gets -- so an arm never states an allocation and an allocation never
# states a setting.
defaults:
  - ../base/default@_global_
  - alloc@_global_
  - _self_

trial_name: 0818-4gpu

stats_logger:
  wandb:
    group: 0818-4gpu
