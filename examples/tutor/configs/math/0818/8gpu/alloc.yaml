# 8 GPUs: 4 for generation, 4 for the actor, with their colocated SGLang
# memory split stated here as an allocation-specific resource setting.
#
# This file is the single place the 8-GPU allocation is written down. Every arm at
# this allocation composes it, so a change here reaches all of them.
cluster:
  n_gpus_per_node: 8

rollout:
  backend: "sglang:d4p1t1"
  max_concurrent_rollouts: 64

actor:
  backend: "fsdp:d4p1t1"

sglang:
  mem_fraction_static: 0.50
