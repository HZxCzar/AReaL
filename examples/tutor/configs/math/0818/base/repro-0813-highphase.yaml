# Current-code reproduction of the HIGH-PERFORMANCE segment of
# 20260813_053934_0810fc-leak-local.
#
# Provenance matters: the source is the first W&B segment
# offline-run-20260813_054251 (steps 0-171), not the resumed six-step segment
# whose final config.yaml contains max_new_tokens=1024, format termination and
# episode_loss_weighting=true. The latter settings are intentionally absent.
#
# This arm restores every behaviorally relevant difference that YAML can express:
#   - 4096-token rollout and pre-solve budget
#   - malformed turns continue, as in the successful segment
#   - one independently sampled pre-solve per rollout (the pre-20260815 default)
#   - leak is turn-local; format_error is not
#   - no dual clip and no episode-length loss weighting
#   - the no-teaching baseline and the original evaluation cadence are enabled
#
# One deliberate operational deviation: stop at step 160. The source run's
# rolling-16 peak was at steps 144-159 and it began collapsing around step 162.
# c_clip=null is required for fidelity but removes the current negative-advantage
# guard rail, so extending this arm to 500 steps is not recommended.
#
# This arm intentionally keeps the current complete-return baseline so its running
# 20260820 instance remains a clean config-only comparison. The sibling
# repro-0813-exclude-local-baseline arm tests whether local penalties stay outside the baseline.
defaults:
  - default@_global_
  - _self_

trial_name: 0818-repro-0813-highphase

total_train_steps: 160
max_turns: 5
leak_handling_mode: terminate
format_handling_mode: continue
teacher_history_tags: masked

gconfig:
  n_samples: 8
  max_new_tokens: 4096
  max_tokens: 24576
  greedy: false
  temperature: 0.7
  top_p: 1.0

teacher_pre:
  enabled: true
  mode: filter_solver
  verify: true
  attempts: 3
  max_tokens: 0
  visibility: rollout
  share_per_group: false
  on_reject: skip

student_generalize:
  enabled: true
  mode: always
  replays: 4
  retest_original: true
  retest_reward: 1.0

reward:
  leak_penalty: -1.0
  leak_penalty_mode: rawbase
  leak_penalty_aggregation: episode
  format_error_penalty: -0.5
  turn_local_components: ["leak"]

free_chat:
  enabled: true
  budget: 5
  no_teaching_baseline: true

actor:
  c_clip: null
  eps_clip: 0.4
  advantage_estimator: rebn
  turn_discount: 1.0
  group_baseline: episode
  group_baseline_leave1out: true
  episode_loss_weighting: false
  num_iterations: 2

# The original first segment evaluated before training and every 25 steps.
# Keeping it here also preserves the inference/RNG call ordering as closely as
# current code allows. It is expensive (roughly 30 minutes per pass).
evaluator:
  eval_before_train: true
  freq_epochs: null
  freq_steps: 25
  freq_secs: null
  student_model_names:
    - qwen3-1.7b
  teacher_pre_enabled: true
  teacher_pre_verify: false
  leak_terminate: false
  format_terminate: false

# Both the old run and the later 0818 runs resolved this to true.
sglang:
  disable_radix_cache: true
