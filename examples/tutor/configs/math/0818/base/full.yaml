defaults:
  - default@_global_
  - _self_

trial_name: 0818-full

student_models: []
student_axes:
- behaviors: [text]
  informations:
    original:
      mode: full
    student_fade:
      mode: student_fade
      keep_recent: 0
    teacher_fade:
      mode: teacher_fade
      keep_recent: 0
    long_drop:
      mode: long_drop
      long_drop_words: 50
  template:
    name: qwen3-1.7b
    weight: 1.0
    base_url: ${oc.env:TUTOR_QWEN3_1_7B_BASE_URL}
    model: qwen3-1.7b
    api_key: ${auxiliary_model.api_key}
    timeout: 120
    max_tokens: 2048
    temperature: 0.7
    top_p: 0.8
    max_concurrent_calls: 4
    request_params:
      seed: 42
      extra_headers:
        x-inspire-inference-key: tutor-train-qwen17b-student
      extra_body:
        top_k: 20
        min_p: 0
        chat_template_kwargs:
          enable_thinking: false


student_type_probe:
  enabled: true
  cyclic_permutations: true
  reward_scale: 0
  temperature: 1.0
  max_new_tokens: 1
