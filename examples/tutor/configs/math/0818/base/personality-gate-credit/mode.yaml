# Shared reward/advantage semantics for the gate-pass-only credit experiment.
# This is an overlay, not a runnable arm: ID/OOD configs compose it after their
# existing personality arm so every allocation wrapper stays composition-only.
student_generalize:
  gate_pass_credit_only: true

actor:
  group_baseline: turn
  group_baseline_leave1out: true
  group_baseline_local_reward_mode: exclude
  adv_norm:
    mean_level: null
    std_level: batch
