# Probe-only ablation of the joint arm: the student-type probe is the ONLY reward.
#
# Identical to full-10turns-info-probe-stratified in every other respect -- the
# eight (behavior, information) cells, stratified two-groups-per-cell sampling,
# ten turns, temperature 1.0, eight re-test replays, exclude mode, the
# no-teaching baseline -- so a difference against that arm is attributable to
# the reward and nothing else.
#
# WHY 1.0e-6 AND NOT 0.0. workflow.py raises on
# student_generalize.retest_reward <= 0.0 whenever free_chat is on, because
# without the re-test a free-chat episode would carry no reward at all and every
# group would sit at zero advantage. That premise does not hold in this arm --
# the probe supplies the reward -- but the guard is unconditional, so the
# teaching term is set as small as it can be rather than switched off. Against a
# probe reward in [0, 1] a term of 1e-6 cannot reorder a group, and the ordering
# inside a group is all the advantage depends on.
#
# THE RE-TEST STILL RUNS AND IS STILL REPORTED. replays stays at 8 and
# no_teaching_baseline stays on, so rollout/solved, generalize/train/* and
# retest/improvement are measured every step exactly as in the parent arm. They
# are the point of the ablation: what teaching does when nothing rewards it.
#
# LEAK AND FORMAT PENALTIES ARE UNCHANGED, on purpose. They are constraints
# rather than teaching reward -- leak_penalty -1.0 and format_error_penalty
# -0.5, both turn-local and both excluded from the group baseline -- and leaving
# them alone keeps this arm comparable to its parent.
#
# EXPECT A SMALLER GRADIENT PER STEP. The advantage is the within-group spread
# of the reward, and measured on 20260821_080147 the probe within-group sd is
# 0.087 against 0.263 for the re-test, with 18% of groups under 0.01. This arm
# therefore trains on roughly a third of the signal, and about a sixth of its
# groups contribute none at all. Read it over more steps, not fewer.
#
# WHAT TO WATCH. The information half of the probe sat at chance for the whole
# of 20260821_080147 -- argmax 0.26 against 0.25, slope +0.00 per 100 steps --
# while P(teacher_fade) climbed to 0.63 at +0.14 per 100 steps. If the probe
# reward can teach identification at all, it shows in
# rollout/type_probe/information/argmax_correct, and
# rollout/type_probe/information/rotation_disagreement (0.45 there) should fall
# as the answer stops depending on option order. rollout/solved says what it costs.
defaults:
  - full-10turns-info-probe-stratified@_global_
  - _self_

trial_name: 0818-life-joint-probe-only

student_generalize:
  retest_reward: 1.0e-6
