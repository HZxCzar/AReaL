# 0818-repro-0813 -- 20260813_053934_0810fc-leak-local replayed on today's code.
#
# THIS ARM IS A BISECT, not a candidate. It exists to answer one question with one
# number.
#
# THE QUESTION. Over steps 15-30, with format errors already settled and the runs at
# matched turns (4.4 vs 4.5) and matched pre-solve accept rate (0.93 vs 0.93):
#
#   20260813_053934_0810fc-leak-local           succ|att = 0.5732
#   20260820_034151_0818-stable-explore-4gpu    succ|att = 0.5142
#
# and 0813 went on to 0.6186 in epoch 1 and 0.6599 in epoch 2, which nothing in the
# 0818 family has approached. The gap is a LEVEL, present by step 15. Fifteen updates
# cannot produce six points of teaching through learning dynamics, so it is a
# property of the setup rather than of the optimization -- and every dynamics
# explanation has been measured and killed: entropy (0813 improved while its entropy
# FELL 0.191 -> 0.113, and stable-explore has MORE entropy at 0.159), leak shaping
# (identical in both: terminate, -1.0, episode, turn-local), the credit multiple
# (exactly 1.000 at every turn count), no_teaching_baseline (advantage distributions
# statistically identical), replay noise (fixed from 51% to 12% of advantage variance
# and the level did not move), episode_loss_weighting via its documented channel
# (longest-decile gradient mass 14.2% against 10% for equal weighting, and 0813's raw
# spread was LARGER at 17.9%), the pre-solve gate, the student endpoint, staleness,
# format rate, verbosity, and the problem draw.
#
# What remains is nine config fields and a week of commits. This arm resolves which:
#
#   succ|att over steps 15-30 lands near 0.57  ->  the cause is in the four settings
#                                                  below, and two short arms bisect
#                                                  them.
#   it lands near 0.51                         ->  the cause is in the code between
#                                                  Aug 13 and now, starting with
#                                                  f3ac572d, and the bisect moves to
#                                                  commits.
#
# Thirty steps is enough. Do not run this to 500 (see the c_clip warning below).
#
# THE FOUR OVERRIDES, which are every substantive difference between 0813's saved
# config.yaml and 0818/4gpu/base.yaml as it resolves today.
#
# actor.c_clip 3.0 -> null. WARNING: this removes the dual-clip guard that
# base/default.yaml documents at length as the fix for 20260816_070410, which it
# destroyed at step 195 -- pg_loss1 unbounded on the negative branch, importance
# weights to 1e-43, entropy 0.105 -> 9.8. It is being removed because 0813 ran
# without it and this arm is a replication. It is also the least likely culprit:
# dual clipping binds 0.017-0.027% of tokens in the 0818 runs, so it is nearly inert.
# At 30-40 steps step 195 is far away. DO NOT extend this arm without putting it back.
#
# actor.episode_loss_weighting false -> true. Scales each turn's advantage by
# (mean episode token count / this episode's token count), so every episode
# contributes equal gradient mass. Requires advantage_estimator rebn, which the
# default already sets. Measured effect is small in both directions -- see the
# 14.2%/17.9% figures above -- but it is a real difference and it is free to restore.
#
# gconfig.max_new_tokens 4096 -> 1024. actor.max_new_tokens is
# ${gconfig.max_new_tokens} in base/default.yaml, so it follows and does not need its
# own line. Note the cap does not appear to bind in either run: measured response
# length is ~320 tokens a turn in both, well under 1024. Carried anyway, because the
# point of this arm is faithfulness rather than a hypothesis.
#
# reward.turn_local_components [leak, format_error] -> [leak]. Lists replace on
# merge, so naming one component drops the other. Format errors run 0.000 in the
# 0818 arms after step 10, so this should be inert; carried for the same reason.
#
# TWO DELIBERATE DEVIATIONS FROM 0813, both provably outside the training loop.
#
# Eval is off, inherited from noeval. 0813 ran evaluator.freq_steps 25 with
# eval_before_train true, which at ~30 min a pass would spend over an hour of the
# bisect measuring something this arm does not read. Eval pauses training and runs
# its own workers; it does not enter a gradient.
#
# 0813's student_models listed three entries -- qwen3-1.7b at weight 1.0,
# llama-3.1-8b-instruct at 0.0, gemma-3-1b-it at 0.0. Weight 0.0 is never drawn by
# _select_student, so the pool it actually taught was the single qwen3-1.7b this
# arm inherits. The two extra entries would only build two more AsyncLLMCaller
# objects that nothing calls.
#
# NOT CARRIED, because the fields did not exist on Aug 13 and their present defaults
# are the inert value: cross_eval (enabled false), opd.teacher_source (opd.enabled
# false), student_axes (empty), free_chat.transfer_prompts (false),
# evaluator.format_terminate and evaluator.teacher_pre_enabled (eval is off).
# free_chat.no_teaching_baseline needs no line: 0813 ran it true and
# base/default.yaml now sets true.
#
# student_generalize.replays stays at 4, which is what 0813 ran. That leaves the
# advantage roughly half replay noise, so read the WINDOW MEAN over steps 15-30 and
# not the per-step series -- per-step standard error is about 0.035, and the number
# being tested is a 0.059 difference.
#
# WHAT TO READ, in one line: mean of
# generalize/train/student_original_correct_given_attempted over steps 15-30,
# against 0.5732 (0813) and 0.5142 (stable-explore).
# CORRECTION, 20260820. Two fields were wrong in the first version of this arm and
# 20260820_065003_0818-repro-0813-4gpu is invalid because of them.
#
# teacher_pre.share_per_group false. 0813 dumped None for this field, and its
# docstring records that it defaulted to FALSE until 20260815 -- every arm before that
# drew one pre-solve draft PER ROLLOUT, so a group of 8 saw 8 different drafts and 8
# different prompts (measured on 20260814_223024: 12 of 19 problems had all 8 rollouts
# on 8 different drafts). Every 0818 arm shares one draft across the group. This is
# the largest single difference between 0813 and today and the first version of this
# file missed it. COST: 8 pre-solve generations per problem instead of 1, which are
# teacher generations, so expect the step time to rise materially.
#
# teacher_pre.max_tokens 4096. max_tokens 0 means reuse the rollout max_new_tokens,
# so the 1024 override above also cut the PRE-SOLVE budget to 1024 and starved the
# gate: 20260820_065003 ran attempted 0.61-0.75 against 0813's 0.85-0.95, which drops
# a quarter of the groups and leaves succ|att measured on an easy subset. Pinning
# 4096 keeps the teaching turns at 1024 -- the setting under test -- while taking the
# gate out of the experiment. This is a deliberate deviation from 0813, which reached
# 0.90 accept at 1024 on the old code; that discrepancy is a code-side difference and
# deserves its own bisect, but it cannot be allowed to confound this one.
defaults:
  - noeval@_global_
  - _self_

trial_name: 0818-repro-0813

gconfig:
  max_new_tokens: 1024

actor:
  c_clip: null
  episode_loss_weighting: true

reward:
  turn_local_components: ["leak"]

teacher_pre:
  share_per_group: false
  max_tokens: 4096
