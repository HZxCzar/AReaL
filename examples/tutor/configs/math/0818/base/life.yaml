# Local-reward baseline ablation continuing repro-0813-highphase.
#
# The inherited arm restores the successful first W&B segment's YAML settings.
# This overlay leaves local rewards on their originating turns but excludes all
# of them from the group-baseline statistic. The source arm localizes only leak.
# To apply the same mode to format as well, set
# the following list:
# reward.turn_local_components to ["leak", "format_error"].
defaults:
  - default@_global_
  - _self_

trial_name: 0818-life-baseline

actor:
  group_baseline_local_reward_mode: exclude

gconfig:
  temperature: 1.0

student_generalize:
  replays: 16

max_turns: 10

evaluator:
  # NOT OPTIONAL. base/default.yaml names 'qwen3-1.7b', which no longer exists once
  # the pool is the eight qwen3-1.7b-<behavior>-<information> cells, and configs.py
  # raises on an eval student with no student_models entry -- so the run would fail
  # at startup rather than at the first eval.
  student_model_names: null
  eval_before_train: false
  freq_epochs: null
  freq_steps: null
  freq_secs: null

free_chat:
  enabled: true
  budget: 10
  no_teaching_baseline: true