# 0818 full-students -- every (behavior, information) cell, all of them trained.
#
#   behavior      text | code                                    2 values
#   information   original | student_fade | teacher_fade | long_drop   4 values
#
# Eight learners over one frozen model and one endpoint, drawn one per GRPO group.
# SETTINGS ONLY: the allocation comes from <n>gpu/alloc.yaml, so this file never
# says how many GPUs it wants.
#
# WHY ALL FOUR INFORMATIONS. The three fades instantiate a live disagreement about
# what teaching has to do -- teacher_fade favours elicitation (only what the student
# produced itself survives), student_fade favours long self-contained explanations
# (each teacher message must stand alone), long_drop favours brevity (teacher text
# past long_drop_words is never read at all). 'original' hides nothing and is the
# reference the other three are read against. Trained rather than held at weight
# 0.0, so the comparison is within one policy's experience instead of against a
# cell it never saw.
#
# A mask installs no behaviour and fits no parameters; it removes information, and
# the differential teaching need follows from the removal. That is what makes it
# defensible where a prompted persona was not: this student ignores a
# self-description, and an SFT profile has to be defended as a modelling choice.
#
# EVAL IS OFF. eval_before_train false and every frequency null, following
# 0810/4gpu/masked-students.yaml. The quantity this arm exists to produce is the
# ADAPTATION SIGNATURE -- whether the teacher's behaviour differs by which learner
# it drew -- and that is a training-side number available every step from the
# per-student reward and re-test series.
#
# IF YOU DO TURN EVAL BACK ON, know what it costs. The evaluator duplicates the
# validation set once per student NAME, and evaluator.max_samples truncates BEFORE
# that expansion (train.py:464-471), so
#
#     eval episodes per pass = min(max_samples, len(valid)) x eval students
#
# Eight students on the full 528-problem split is 4224 episodes a pass. A pass
# measured 1650-1840 s at ONE student, so expect 3.5-4 h, and at freq_steps 25 over
# 500 steps that is twenty of them -- more wall clock than the training it is
# measuring. max_samples 66 puts it back to 528 episodes, one of today's passes,
# at the price of a 6 pp standard error per student instead of 2 pp.
defaults:
  - default@_global_
  - _self_

trial_name: 0818-full-students

# REQUIRED, not tidiness. base/default.yaml carries one student at weight 1.0 and
# student_axes expansion APPENDS, so without this the default student stays in the
# pool and is drawn alongside the eight.
student_models: []

student_axes:
- behaviors: [text, code]
  informations:
    # Hides nothing. The reference the three fades are read against.
    original:
      mode: full
    # Coverage: keeps what it was told, forgets what it said.
    student_fade:
      mode: student_fade
      keep_recent: 0
    # Generation: keeps its own words, forgets the teacher's. keep_recent 0 and not
    # 1 -- at 1 the most recent teacher turn survives into history and, with the
    # live turn always visible, the student would effectively retain two.
    teacher_fade:
      mode: teacher_fade
      keep_recent: 0
    # Brevity: teacher text past 75 words is never read, in history AND in the turn
    # being answered, because this is an attention limit rather than a memory one.
    long_drop:
      mode: long_drop
      long_drop_words: 75
  # One copy of the endpoint for all eight cells. weight is the total for the block
  # and is split evenly, so each cell is drawn an eighth of the time and the block
  # draws as often as a single student would.
  template:
    name: qwen3-1.7b
    weight: 1.0
    base_url: ${oc.env:TUTOR_QWEN3_1_7B_BASE_URL}
    model: qwen3-1.7b
    api_key: ${auxiliary_model.api_key}
    timeout: 120
    max_tokens: 2048
    temperature: 0.7
    top_p: 0.8
    # 4, NOT the 32 every other arm uses, and this is arithmetic rather than
    # caution. One AsyncLLMCaller is built PER STUDENT ENTRY, each with its own
    # concurrency semaphore, and all eight cells are the same qwen3-1.7b endpoint.
    # At 32 each the endpoint could see 8 x 32 = 256 concurrent requests against
    # the 32 the base tuned it for. A saturated endpoint does not slow down, it
    # refuses: student_models[*].timeout is 120 s and the symptom is
    # student/<name>/call_failed, which corrupts an episode's reward rather than
    # just costing time. 8 x 4 = 32 keeps the endpoint's total where it was.
    #
    # Raise it only if the endpoint is measured to tolerate more, and watch
    # student/*/call_failed when you do.
    max_concurrent_calls: 4
    request_params:
      seed: 42
      extra_headers:
        x-inspire-inference-key: tutor-train-qwen17b-student
      extra_body:
        top_k: 20
        min_p: 0
        chat_template_kwargs:
          enable_thinking: false

evaluator:
  # NOT OPTIONAL. base/default.yaml names 'qwen3-1.7b', which no longer exists once
  # the pool is the eight qwen3-1.7b-<behavior>-<information> cells, and configs.py
  # raises on an eval student with no student_models entry -- so the run would fail
  # at startup rather than at the first eval.
  student_model_names: null
  eval_before_train: false
  freq_epochs: null
  freq_steps: null
  freq_secs: null
