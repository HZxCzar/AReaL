# 0818-stable-explore -- temperature 1.0, a decaying learning rate, and a re-test
# measured four times more precisely. Three lines, addressing three parts of one
# failure.
#
# WHY. 20260818_180509_0818-default-noeval-4gpu does not break in any of the ways
# earlier arms broke. Measured on its own rollout dumps, clean (non-leaked) episodes
# fell from 0.6118 +- 0.0054 over steps 75-93 to 0.5478 +- 0.0049 over 95-118:
# -0.064, z = -8.75 across ~19k episodes. Everything mechanical stayed clean for the
# whole run -- teacher_pre/accepted flat at 0.92, student call_failed ~0, sample
# staleness constant, format_errors 0.000, turns 4.52, entropy 0.07, response length
# flat -- and the leak rate FELL (0.051 -> 0.030), which should have raised the
# average, since a leaked episode terminates early and teaches less.
#
# What moved is how far each update travels. Over the same two windows:
#
#   ppo_actor/update/kl_div_taylor/avg     0.0312  -> 0.0494    +58%   z = +7.5
#   ppo_actor/update/dual_clip_ratio/avg   1.70e-4 -> 2.69e-4   +58%   z = +5.5
#   ppo_actor/update/kl_div_direct/avg     0.0223  -> 0.0311    +40%   z = +7.5
#   ppo_actor/update/clip_ratio/avg        0.00709 -> 0.00887   +25%   z = +9.5
#   rollout/solved                         0.5492  -> 0.4886    -11%   z = -5.7
#
# Bigger steps, worse results, held for 24 consecutive steps. approx_kl is negative
# and growing (-0.0052 -> -0.0076): each update adds probability mass to the tokens
# it just sampled, so the policy sharpens onto its own output harder as it converges.
#
# And half of what it sharpens onto is measurement noise. Per GRPO group of eight,
# the within-group sd of episode reward is 0.346, while re-testing a temperature-0.7
# student four times contributes sqrt(p(1-p)/4) = 0.246 on its own. Noise is 51% of
# the variance the advantage is computed from at steps 60-94 and 54% at 95-118 --
# the share grows as real teaching differences shrink. 13-14% of groups have zero
# spread and contribute no gradient at all.
#
# WHAT THIS CHANGES.
#
# gconfig.temperature 0.7 -> 1.0. base/default.yaml sets actor.temperature to
# gconfig.temperature by interpolation, so the trainer tempers its recomputed
# logprobs to match and this stays one self-consistent policy. There is no
# sampling/update mismatch being fixed -- every run in this tree has actor and
# gconfig temperature equal. The reason is exploration alone: the GRPO gradient IS
# the within-group spread. Note that the recommended 0.7 is a triple (top_k 20,
# top_p 0.8/0.95) and the teacher already runs top_p 1.0 with top_k unset, so its
# 0.7 was never the recommended 0.7. eval_gconfig is deliberately left at 0.7.
#
# actor.optimizer.lr_scheduler_type constant -> cosine. The load-bearing line. lr is
# 5.0e-05 with warmup_steps_proportion 0.001, so the step at 118 was the step at 1
# while the remaining headroom was a fraction of it. The horizon is
# ft_spec.total_train_steps, 500 here, and min_lr_ratio defaults to 0.0, so the rate
# anneals to zero at 500; stopping early stops at a cos-decayed rate, which is the
# intent.
#
# student_generalize.replays 4 -> 16. The reward is the fraction correct over these
# attempts, so measurement sd falls as 1/sqrt(replays): 0.246 -> 0.123, taking noise
# from ~51% of the advantage variance to ~20%. The only change here that improves
# the signal rather than how it is spent.
#
# NOT AN ASYMMETRIC CLIP. base/explore.yaml paired temperature 1.0 with eps_clip 0.2
# and eps_clip_higher 0.4; 20260819_062045 took entropy 0.294 -> 5.89 by step 115
# and teacher_pre/accepted 0.956 -> 0.061, so 94% of episodes never started. Over
# the first 30 steps, on matched advantage distributions, baseline entropy FALLS
# 0.176 -> 0.089 and explore RISES 0.294 -> 0.796: temperature is a one-time offset,
# the clip set the slope. eps_clip stays 0.4 symmetric and eps_clip_higher unset.
#
# LEFT ALONE ON PURPOSE: num_iterations 2 and eps_clip 0.4. Eight gradient passes
# over a half-noise batch, and a trust region at double the conventional width, both
# let one batch move the policy further than intended, and both are the next
# candidates if a decaying rate is not enough. This arm tests three levers, not five.
#
# PAIRED WITH noeval, so the control is a run that already exists:
# 20260818_180509_0818-default-noeval-4gpu. One caveat -- base/default.yaml gained
# free_chat.no_teaching_baseline: true after that run launched, so this arm carries
# it and the control does not. It subtracts a per-problem constant and
# actor.group_baseline already removes one; two runs differing only in it have
# statistically identical advantage distributions, so it moves the logged reward
# LEVEL and not the gradient. Compare reward levels against explore, and compare
# generalize/train/* against 20260818_180509.
#
# COST. replays 16 adds 12 student calls per episode (replays - 1 per variant, and
# only the original re-test is enabled). At 128 episodes a step that is ~2000
# re-test calls against ~500 today; student_models[0].max_concurrent_calls is 32, so
# they queue rather than flood the endpoint and the cost is wall clock, not
# refusals. Expect the 300 s step of 20260818_180509 to land near 400-450 s. Measure
# over five steps before committing to 500.
#
# WHAT TO WATCH, in order.
#
#   ppo_actor/update/kl_div_taylor/avg   The point of the arm. It rose 58% while the
#                                        objective fell; under a decaying rate it
#                                        should fall over training. Still climbing
#                                        past step 100 means the rate was not the
#                                        binding constraint and num_iterations is
#                                        next.
#   rollout/teacher_pre/accepted         The tripwire, and a sharp one: it caught the
#                                        explore collapse 65 steps before the bottom
#                                        while format_errors sat at 0.006. Below
#                                        0.85 for five consecutive steps, stop.
#   generalize/train/student_original_correct_given_attempted
#                                        The objective. Read it per EPOCH -- 47.4
#                                        steps at batch 16 over 759 problems -- not
#                                        per step. The baseline ran 0.5549, 0.5820,
#                                        0.5306 and its decline is only legible at
#                                        that resolution.
#   rollout/student/qwen3-1.7b/call_failed
#                                        The replay load. Anything above 0 means 16
#                                        replays saturated the endpoint, which
#                                        corrupts rewards rather than just costing
#                                        time.
#   ppo_actor/update/entropy/avg         At 1.0 with a symmetric clip expect a level
#                                        near 0.15-0.35, not a slope. Past 2.0 and
#                                        still climbing, the clip is not holding it.
defaults:
  - noeval@_global_
  - _self_

trial_name: 0818-stable-explore

gconfig:
  temperature: 1.0

actor:
  optimizer:
    lr_scheduler_type: cosine

student_generalize:
  replays: 16
