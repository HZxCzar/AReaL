# One policy trained against a single personality: expertise reversal, the other pole of the same interaction.
#
# SETTINGS ONLY: the allocation comes from <n>gpu/alloc.yaml, so this file never says
# how many GPUs it wants.
#
# The student block is the whole arm. One entry at weight 1.0, so the per-group draw
# has nothing to choose and every rollout of a GRPO group faces the same demand.
# Read against the joint policy in base/personality/ID/all.yaml: a specialist that
# beats the generalist on its own personality, where the generalist cannot tell the
# personalities apart, is the signature this axis exists to find.
#
# In a single-personality arm the demand is CONSTANT, so the policy can learn it as a
# prior and satisfy it at turn 1 without being told -- which the joint policy cannot
# do, since nothing in its prompt names the student. Turn-1 compliance rising here is
# therefore the specialist result, and it is unavailable jointly.
defaults:
  - ../../default@_global_
  - _self_

trial_name: 0818-personality-rule_first

student_models:
- name: qwen3-1.7b-text-original-rule_first
  weight: 1.0
  mode: text
  mask:
    mode: full
  personality: rule_first
  base_url: ${oc.env:TUTOR_QWEN3_1_7B_BASE_URL}
  model: qwen3-1.7b
  api_key: ${auxiliary_model.api_key}
  timeout: 120
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.8
  # 32, as in base/single/*.yaml, and it must NOT be raised for a larger allocation.
  # One AsyncLLMCaller is built per student entry and the endpoint is tuned for 32
  # concurrent student requests in total; a saturated endpoint refuses rather than
  # slows, and the symptom is student/<name>/call_failed corrupting an episode's
  # reward rather than merely costing time.
  max_concurrent_calls: 32
  request_params:
    seed: 42
    extra_headers:
      x-inspire-inference-key: tutor-train-qwen17b-student
    extra_body:
      top_k: 20
      min_p: 0
      chat_template_kwargs:
        enable_thinking: false
