# One policy trained against the ungated student: no personality, no gate.
#
# The fifth in-domain cell, and the reference the four demanding ones are read
# against. A specialist trained here is a teacher that never had to satisfy anyone's
# manner, so the comparison against the four says what the demand itself bought.
#
# SETTINGS ONLY: the allocation comes from <n>gpu/alloc.yaml. No personality block is
# needed -- nothing in this arm demands a personality, so the gate never runs and the
# prompt files are never read.
defaults:
  - ../../default@_global_
  - _self_

trial_name: 0818-personality-none

student_models:
- name: qwen3-1.7b-text-original
  weight: 1.0
  mode: text
  mask:
    mode: full
  base_url: ${oc.env:TUTOR_QWEN3_1_7B_BASE_URL}
  model: qwen3-1.7b
  api_key: ${auxiliary_model.api_key}
  timeout: 120
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.8
  # 32, as in base/single/*.yaml, and it must NOT be raised for a larger allocation.
  max_concurrent_calls: 32
  request_params:
    seed: 42
    extra_headers:
      x-inspire-inference-key: tutor-train-qwen17b-student
    extra_body:
      top_k: 20
      min_p: 0
      chat_template_kwargs:
        enable_thinking: false
