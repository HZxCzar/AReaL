# Life arm with one final joint student-type probability reward.
# The teacher is asked a separate question for every non-singleton student axis
# only after the dialogue. Each such axis is cyclically rotated, mapped back, and
# averaged; singleton axes are deterministic and skipped. The reward is
#
#   existing retest reward + P(correct configured student type).
#
# The probe completion is a sidecar: it is neither appended to the dialogue nor
# included in PPO tensors.
defaults:
  - full@_global_
  - _self_

trial_name: 0818-full-probe-only

student_type_probe:
  reward_scale: 1.0

student_generalize:
  retest_reward: 1.0e-6
