defaults:
  - qwen8b-train-qwen1.7b-eval3-math-pre-aleak-generated-g8k4-leakt-guided3@_global_
  - _self_

trial_name: qwen8b-qwen1.7b-guided3-opd

# Both mechanisms at once. They act on different turns and through different
# channels, so they should compose: guided slots put move variety into turn 1 of
# 3 of the 8 rollouts and are trained through the GRPO advantage on a rewritten
# prompt; OPD supervises turn 3 onward in every rollout through a token-level KL
# on the unmodified prompt. Run the two single-mechanism configs first so this
# one is interpretable.
#
# See the -guided3 and -opd siblings for the evidence behind each block.
opd:
  enabled: true
  # kl_penalty_coef in the reference implementation, whose default is also 1.0.
  # The scale comes from the KL being in nats, not from the task reward, so this
  # is not comparable to a loss weight.
  loss_weight: 1.0
  min_prior_failed_turns: 2
  max_turns_per_episode: 0
  # Not in the reference, which does not clip. 0 keeps the standard behaviour;
  # raise it only if opd_advantage turns out to be dominated by outlier tokens.
  reward_clip: 0.0
  # Guided turns are already trained on a rewritten prompt. Supervising them too
  # would stack two perturbations on one row and make neither attributable.
  skip_guided_rows: true
  skip_leaked_rows: true

stats_logger:
  wandb:
    group: 8b-guided-slots-opd
