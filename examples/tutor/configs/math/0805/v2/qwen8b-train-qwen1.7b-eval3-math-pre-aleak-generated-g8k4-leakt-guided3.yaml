defaults:
  - qwen8b-train-qwen1.7b-eval3-math-pre-aleak-generated-g8k4-leakt@_global_
  - _self_

trial_name: qwen8b-qwen1.7b-guided3

# Across-task diversity: reserve 3 of the 8 rollouts in each group for a
# prescribed teaching move.
#
# Why this is needed. The trained policy plays one move -- PINPOINT on 86.3% of
# turns, move entropy falling 1.77 -> 1.16 bits over training. It is not a
# capability loss: checkpoint step199 matches the base model on per-move quality,
# leak rate and instruction compliance, so this is propensity. The cost is that
# GRPO has nothing to compare against. Eight free rollouts contain the state's
# best move only 37.7% of the time; even 32 only reach 66.6%. Three prescribed
# slots reach 78%, and best-in-group value goes from 29.1% to 40.7% of the
# available gap.
#
# Why it should generalize rather than memorize. Which move is best is a
# task-level property worth +7.2% [+3.8, +10.8] over one fixed move, it transfers
# to unseen problems (cross-task kNN +7.9% [+2.1, +13.7]), and it is not leak
# avoidance (+8.1% among actions that never leak). Per-state selection on top of
# per-task adds nothing even with an oracle (-1.4% [-5.0, +2.2]), which is why
# only the first turn is guided -- that is where the group still shares a state,
# and the finer-grained signal does not exist.
#
# The instruction is stripped from the prompt the turn is trained on, so what the
# policy learns is "this move suited this task", not "obey instructions". That
# makes the guided turn off-policy, which is what actor.use_decoupled_loss and
# behave_imp_weight_cap (both already on in the parent) exist to handle: prox_logp
# is recomputed on the training prompt and the resulting weight is capped at 5.
guided_slots:
  enabled: true
  slots: 3
  # Provisional. The 1-turn ranking puts REFRAME first, but 38.7% of successes
  # arrive after turn 1, and at a 3-turn horizon DECOMPOSE overtakes it and PROBE
  # goes 7.5% -> 26.5%. The 491-state 3-turn run
  # (analysis/hazard_20260806/stage1_full.jsonl) settles the final list.
  #
  # WORKED is deliberately absent: it is worth 23.6% when legal but leaks the
  # answer 58% of the time when forced, and a leak terminates the episode.
  moves: [DECOMPOSE, REFRAME, PROBE]
  turns: [1]
  rotate_by_task: true

stats_logger:
  wandb:
    group: 8b-guided-slots
