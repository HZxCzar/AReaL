# ...-g8k4-leakt-full -- the g8k4-leakt setup on the whole 759/528 split,
# with the transfer probes off and the original re-test still on.
#
# Three values differ from the parent. Everything else is inherited untouched,
# so arms built on this compare to each other but NOT to the 0808 arms, which
# run on 132/118.
#
# 1. student_generalize.source: generated -> sidecar, with an empty path.
#
# That one value was doing two unrelated jobs. It selected the transfer bank,
# and -- via train.py:398 and :420 -- it also filtered BOTH splits down to the
# ids that happen to have verified variants:
#
#       generated   132 train / 118 test
#       here        759 train / 528 test
#
# Transfer is not being measured and its rewards were already 0.0, so the filter
# was buying nothing and costing 4.5x the test set. With source "sidecar" and an
# empty path, load_student_generalize_bank returns {} (core/generalization.py:19)
# and no filter runs.
#
# 2. level1_enabled / level2_enabled: false.
#
# Until now student_generalize.enabled was one switch for three probes, so
# keeping the re-test meant paying for two variant probes AND satisfying a
# startup validator that demanded a complete variant case on all 759 rows.
# The three are separate switches now. With both transfer levels off:
#
#   - _probe_levels() returns ("original",) alone, so the variant probes are
#     never built and never called.
#   - _validate_student_generalize_datasets returns before it loads a split,
#     because no probe reads the bank and there is nothing a row could lack.
#   - _should_skip_missing_generated_variants stops discarding rollouts.
#
# Probe cost per completed episode goes from 12 student calls (3 probes x
# replays 4) to 4. retest_original is unaffected and keeps reporting.
#
# 3. evaluator.average_rollouts: 3 -> 1.
#
# A compute trade that also measures better. At 118 test problems x 3 rollouts,
# eval was 354 episodes against 1280 train episodes per 10 steps -- 28%. Keeping
# 3 rollouts over 528 problems would be 1584 episodes, more than the training
# itself. One rollout over 528 is 41%, only slightly above today.
#
# Problems differ from each other far more than repeat rollouts of one problem
# do, so for a mean success rate 528x1 beats 118x3: the standard error goes from
# about 4.6 pp to about 2.2 pp and the 95% interval from about +-9.0 pp to about
# +-4.3 pp.
#
# What it gives up is repeat/final_correct/* -- the eval-stability diagnostics,
# which need eval_repeat_count > 1. Diagnostics, not the headline. One line to
# put back.
#
# WHAT THIS DOES NOT FIX
#
# Deep conversations do not get denser per step. A batch is 16 problems x G=8
# whatever the split size, and per problem the big set is if anything slightly
# thinner: pooling four July runs on this same 759-row split, 28.1% of problems
# reached >= 3 tutor turns on at least a quarter of their rollouts, against
# 36.3% on the filtered 132. What changes is the absolute count -- roughly 211
# such problems here against roughly 48 -- and that is what would make a
# deep-problems-only TRAIN filter viable later while leaving the 528-problem
# test split alone. Filtering both is what the decidable set did, and it is why
# that set cannot measure anything.
defaults:
  - qwen8b-train-qwen1.7b-eval3-math-pre-aleak-generated-g8k4-leakt@_global_
  - _self_

trial_name: qwen8b-train-qwen1.7b-eval3-math-pre-aleak-g8k4-leakt-full

student_generalize:
  # Stays true: it is the master switch for the probe machinery, and the
  # re-test lives inside it.
  enabled: true
  # Empty bank. Nothing below reads it.
  source: sidecar
  path: ""
  # The only probe that runs. After every termination, ask the same student to
  # solve the ORIGINAL task again from the completed chat, in an independent
  # branch. Logged, never rewarded.
  retest_original: true
  level1_enabled: false
  level2_enabled: false
  # 4 attempts, so the logged re-test rate is a fraction rather than one coin
  # flip. With the variants off this is 4 student calls per episode, not 12.
  replays: 4
  # Inherited as 0.0 already; restated because a non-zero value here with the
  # levels off would be silently ignored.
  level1_reward: 0.0
  level2_reward: 0.0

evaluator:
  average_rollouts: 1

# saver.freq_steps stays at the inherited 50. The parent set it with the comment
# that an epoch was about 9 batches on the filtered 132 rows; on 759 rows at
# batch_size 16 an epoch is 47 steps, so 50 is now about one epoch rather than
# five. Left alone deliberately -- moving it would put checkpoints at different
# points than the arms this is read against.
