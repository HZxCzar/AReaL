defaults:
  - qwen8b-train-qwen1.7b-eval3-math-pre-aleak-generated-g8k4-tonly-leak1@_global_
  - _self_

trial_name: qwen8b-train-qwen1.7b-eval3-math-hard250-pre-aleak-generated-g8k4-tonly-leak0

# Same as -tonly-leak1 (transfer is the only positive signal, no termination on
# leak) with the leak penalty removed entirely. Leaks are still detected, still
# logged in rollout/leaks, still recorded as a reward component -- they just cost
# nothing, so the teacher is free to reveal whatever it likes and the only thing
# that pays is the student transferring to the variant.
#
# Set this to -0.1 instead of 0.0 for the "very small penalty" variant.
reward:
  leak_penalty: 0.0

student_generalize:
  # Split one unit of transfer reward across the two independently verified
  # levels, preserving the old maximum reward scale.
  level1_reward: 0.5
  level2_reward: 0.5
  

stats_logger:
  wandb:
    group: 8b-student-diversity-transfer-only-hard250
