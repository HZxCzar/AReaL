defaults:
  - qwen8b-train-qwen1.7b-eval3-math-pre-aleak-generated-g8k4-leakt@_global_
  - _self_

trial_name: qwen8b-train-qwen1.7b-eval3-math-pass@2-pre-aleak-generated-g8k4-tonly-leak1

# Inherits g8k4: G=8, bs=16, group_baseline=episode, episode_loss_weighting=false,
# shuffle=true, max_concurrent_rollouts=16, K=4 replays.

# Leak no longer stops the rollout; every turn is leak-checked afterwards by the
# same _run_optional_leak_check the terminate path used, then penalized.
leak_handling_mode: reward_only

reward:
  # TRANSFER IS THE ONLY POSITIVE SIGNAL. Solving the base task pays nothing on
  # its own. Because student_generalize.mode=only_success gates the transfer
  # probe behind a solved base task, "solve AND transfer" is the sole way to earn
  # reward -- the gate is what enforces the conjunction, not the reward value.
  success: 0.0
  # Per leaked turn. Not the old -1.0-once-then-stop: with reward_only an episode
  # can leak on several turns and pay each time.
  leak_penalty: -1.0
  leak_penalty_aggregation: turn

student_generalize:
  # Raised from 0.5 now that it is the only thing paying out, so the scale of a
  # good episode stays comparable to the old success=1.0.
  level1_reward: 1.0
  level2_reward: 0.0

stats_logger:
  wandb:
    group: 8b-student-diversity-transfer-only
